name: MSRV

# The declared rust-version, native and wasm32. Off the push run (ci.yml runs the required set,
# nothing more; the owner's word of 2026-10-27); on demand (`gh workflow run msrv.yml --ref
# <line>`) and called by release.yml on every version tag before it publishes.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

# a newer dispatch on the same ref waits for the one running; a tag's call is never cancelled
concurrency:
  group: msrv-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # the declared rust-version (bsv-stack-lean #139): the library with every feature, native and
  # wasm32, on that toolchain, the dependencies resolved to versions it supports
  msrv:
    name: msrv
    runs-on: ubuntu-latest
    env:
      CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: "1.88.0"
          targets: wasm32-unknown-unknown

      - name: The manifest declares this toolchain
        run: grep -qx 'rust-version = "1.88"' Cargo.toml

      - name: Check the library
        run: cargo check --lib --all-features

      - name: Check the library on wasm32
        run: cargo check --lib --target wasm32-unknown-unknown --no-default-features --features "full,wasm"
