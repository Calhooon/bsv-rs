name: Nightly oracles

# The oracle runs (docs/NIGHTLY.md): the mutation floor (#81), the fuzz
# matrix (#82), and ci.yml's full set on beta and on main, dispatched on each
# line (a pull request runs only its line's required set; the owner's word of
# 2026-10-26). Never on a push or a PR: the gate is ci.yml. On demand only,
# never on a schedule (the owner's word of 2026-10-27: the nightly runs were a
# waste of resources). Since cut 7 (the owner's word of 2026-11-02, "or maybe
# a fraction"): a night mutates only the files the reach rule names since the
# last complete run and carries every other figure with its run's id and sha
# (`nightly_mutants.py plan`); the complete run is `mode: complete`, at each
# prerelease pin and by hand; the fuzz targets run a fixed budget each; the
# bench runs on the `weekly` input.
on:
  workflow_dispatch:
    inputs:
      commit:
        description: The commit to measure, a full sha on the dispatched line (empty for the line's commit at the dispatch, #629)
        required: false
        default: ''
      mode:
        description: incremental (the night, the reach rule's files) or complete (every measured file, twenty-three shards; a prerelease pin)
        type: choice
        options: [incremental, complete]
        default: incremental
      weekly:
        description: Also dispatch bench.yml on the line (the captain's Sunday dispatch; the workflow has no schedule)
        type: boolean
        default: false
      heavy_max_parallel:
        description: The shards' and fuzz targets' slots for this run, an integer from 1 to 20 (empty for the window's figure, 14 inside 01:00Z to 09:00Z, 6 outside; #791)
        required: false
        default: ''

# Every job names its own permissions; only the fuzz job, which files its
# crashes, may write issues.
permissions: {}

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  CARGO_BUILD_JOBS: '2'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_INCREMENTAL: '1'
  CARGO_MUTANTS_VERSION: '27.1.0'
  # cargo-fuzz needs a nightly compiler (-Zsanitizer); pinned by date so a
  # night's build does not move under the corpus.
  FUZZ_TOOLCHAIN: nightly-2026-10-19
  CARGO_FUZZ_VERSION: 0.13.2
  # Cut 7: each target's fixed budget, in minutes (60 until 2026-11-02; run
  # 41347058507's 19 targets took 60 to 63 minutes each, four waves of six,
  # 4h07m). The repository variable NIGHTLY_FUZZ_MINUTES moves it, at most 30
  # under the fuzz job's 45-minute timeout.
  FUZZ_MINUTES: ${{ vars.NIGHTLY_FUZZ_MINUTES || '10' }}

jobs:
  # The full matrix on each line when this workflow is dispatched. A dispatch runs
  # the line's own ci.yml at the line's tip, its github.ref the line, so no job
  # of ci.yml changes for it; a workflow_call from here would run this run's ref
  # (main's on a schedule) and share its concurrency group with main's pushes.
  # A dispatch made with the GITHUB_TOKEN starts a run, as the sync's does.
  # After the heavy work (the fold of #682): each dispatch starts a whole
  # ci.yml run, so beside the shards a complete run held 14 + up to 22 of the
  # twenty. After the shards and the fuzz targets, whatever their result.
  # Beta's run, then main's (#682's second fold, the keeper's word (a) of
  # 2026-11-03): beta's dispatched run holds up to 9 jobs at once and main's,
  # on main's ci.yml, up to 22 (16 before the dependents start), together 31,
  # so the two never run at once. The order lives here and not in a ci.yml
  # concurrency group: a dispatch on main runs main's ci.yml, whose group is
  # per event and ref, so a group added on beta would not hold main's run
  # until main carried it. The cost: this job's one runner, held for beta's
  # run (22m42s in run 41579716973). tests/arch_nightly_cap.rs refuses an
  # edge removed, the wait removed or a dispatch job with a matrix.
  ci-full-beta:
    name: CI full set (beta)
    needs: [mutants, fuzz]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # beta's run alone took 22m42s; the wait gives up at 55 minutes, inside
    # the job's 60, and main's dispatch follows anyway
    timeout-minutes: 60
    permissions:
      actions: write
    steps:
      - name: Dispatch ci.yml on beta, wait for that run and read its conclusion
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Under -euo pipefail (#682's fourth fold): a failing `list | jq` in the
          # poll is an error at once, not an empty count and a "no new run" later.
          set -euo pipefail
          # The run is ours by identity (#682's third fold): a dispatch by this
          # job's token is github-actions[bot]'s, so a hand dispatch is never
          # taken, and a run listed before the dispatch is never taken.
          since="$(date -u -d '-1 minute' +%Y-%m-%dT%H:%M:%SZ)"
          list() {
            gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch beta \
              --event workflow_dispatch --user 'github-actions[bot]' --created ">=$since" \
              --limit 20 --json databaseId,createdAt
          }
          before="$(list)"
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref beta
          run=""
          for _ in $(seq 1 30); do
            new="$(list | jq -c --argjson before "$before" \
              '[.[] | select(.databaseId as $id | [$before[].databaseId] | index($id) | not)]')"
            count="$(jq length <<<"$new")"
            if [ "$count" -gt 1 ]; then
              echo "::warning::$count new ci.yml dispatch runs on beta by github-actions[bot]: $(jq -c '[.[].databaseId]' <<<"$new"); watching the one created nearest after the dispatch"
            fi
            if [ "$count" -ge 1 ]; then
              run="$(jq 'min_by(.createdAt) | .databaseId' <<<"$new")"
              break
            fi
            sleep 10
          done
          if [ -z "$run" ]; then
            echo "::error::no new ci.yml dispatch run on beta by github-actions[bot] in five minutes since $since"
            exit 1
          fi
          echo "beta's ci.yml run: $run $(gh run view "$run" --repo "$GITHUB_REPOSITORY" --json url --jq .url)"
          # Give up at 55 minutes of this job, said in the log, so the job ends
          # before its timeout and main's dispatch follows.
          budget="$((55 * 60 - SECONDS))"
          [ "$budget" -gt 0 ] || budget=1
          watched=0
          timeout "$budget" gh run watch "$run" --repo "$GITHUB_REPOSITORY" \
            --interval 60 > /dev/null || watched=$?
          # 124 is the give-up alone: a warning, then the conclusion read (still
          # "" while the run is in progress, so no verdict). Any other failure of
          # the watch (the API, the network) is an error: it must not leave the
          # night green without beta's verdict (#682's fourth fold).
          case "$watched" in
            0) ;;
            124) echo "::warning::gave up waiting for beta's run $run at 55 minutes (exit 124); main's dispatch follows" ;;
            *)
              echo "::error::watching beta's run $run failed (exit $watched)"
              exit 1 ;;
          esac
          # The night surfaces beta's CI verdict: a red run fails this job
          # (main's still runs, under !cancelled()).
          conclusion="$(gh run view "$run" --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)"
          echo "beta's ci.yml run $run: ${conclusion:-in progress}"
          case "$conclusion" in
            success) ;;
            failure | timed_out | startup_failure)
              echo "::error::beta's ci.yml run $run concluded $conclusion"
              exit 1 ;;
            "") echo "::warning::beta's ci.yml run $run is still in progress, no verdict" ;;
            *) echo "::warning::beta's ci.yml run $run concluded $conclusion, no verdict" ;;
          esac

  # After the weekly bench too (#683): on a Sunday night main's 22 would
  # otherwise start beside the bench's run; skipped on another night, which
  # !cancelled() lets through.
  ci-full-main:
    name: CI full set (main)
    needs: [ci-full-beta, bench]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch ci.yml on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref main

  # Cut 7: the bench weekly. The workflow has no schedule, so "weekly" is the
  # dispatcher's input; bench.yml runs at the line's tip (a dispatch names a
  # ref, never a sha). A heavy job (#683): it dispatched bench.yml at the
  # start of the run, beside the opening wave of shards, with no needs. It now
  # runs after the shards, the fuzz targets and beta's ci.yml run, whatever
  # their result, and waits for the run it dispatched as ci-full-beta does
  # (the bot's run alone, listed before the dispatch; the give-up at 55
  # minutes; the conclusion read), so main's dispatch never starts beside it:
  # the bench's run holds two jobs, then the scoreboard, and this job's one
  # runner. tests/arch_nightly_cap.rs refuses the edge or the wait removed.
  bench:
    name: Bench (weekly)
    needs: [mutants, fuzz, ci-full-beta]
    if: ${{ !cancelled() && inputs.weekly }}
    runs-on: ubuntu-latest
    # The wait gives up at 55 minutes, inside the job's 60, and main's
    # dispatch follows anyway
    timeout-minutes: 60
    permissions:
      actions: write
    steps:
      - name: Dispatch bench.yml on the line, wait for that run and read its conclusion
        env:
          GH_TOKEN: ${{ github.token }}
          LINE: ${{ github.ref_name }}
        run: |
          # The same wait as ci-full-beta's (#682's third and fourth folds).
          set -euo pipefail
          since="$(date -u -d '-1 minute' +%Y-%m-%dT%H:%M:%SZ)"
          list() {
            gh run list --repo "$GITHUB_REPOSITORY" --workflow bench.yml --branch "$LINE" \
              --event workflow_dispatch --user 'github-actions[bot]' --created ">=$since" \
              --limit 20 --json databaseId,createdAt
          }
          before="$(list)"
          gh workflow run bench.yml --repo "$GITHUB_REPOSITORY" --ref "$LINE"
          run=""
          for _ in $(seq 1 30); do
            new="$(list | jq -c --argjson before "$before" \
              '[.[] | select(.databaseId as $id | [$before[].databaseId] | index($id) | not)]')"
            count="$(jq length <<<"$new")"
            if [ "$count" -gt 1 ]; then
              echo "::warning::$count new bench.yml dispatch runs on $LINE by github-actions[bot]: $(jq -c '[.[].databaseId]' <<<"$new"); watching the one created nearest after the dispatch"
            fi
            if [ "$count" -ge 1 ]; then
              run="$(jq 'min_by(.createdAt) | .databaseId' <<<"$new")"
              break
            fi
            sleep 10
          done
          if [ -z "$run" ]; then
            echo "::error::no new bench.yml dispatch run on $LINE by github-actions[bot] in five minutes since $since"
            exit 1
          fi
          echo "the bench's run: $run $(gh run view "$run" --repo "$GITHUB_REPOSITORY" --json url --jq .url)"
          budget="$((55 * 60 - SECONDS))"
          [ "$budget" -gt 0 ] || budget=1
          watched=0
          timeout "$budget" gh run watch "$run" --repo "$GITHUB_REPOSITORY" \
            --interval 60 > /dev/null || watched=$?
          case "$watched" in
            0) ;;
            124) echo "::warning::gave up waiting for the bench's run $run at 55 minutes (exit 124); main's dispatch follows" ;;
            *)
              echo "::error::watching the bench's run $run failed (exit $watched)"
              exit 1 ;;
          esac
          # A red bench run fails this job (main's dispatch still runs, under
          # !cancelled()).
          conclusion="$(gh run view "$run" --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)"
          echo "the bench's run $run: ${conclusion:-in progress}"
          case "$conclusion" in
            success) ;;
            failure | timed_out | startup_failure)
              echo "::error::the bench's run $run concluded $conclusion"
              exit 1 ;;
            "") echo "::warning::the bench's run $run is still in progress, no verdict" ;;
            *) echo "::warning::the bench's run $run concluded $conclusion, no verdict" ;;
          esac

  source:
    name: Pin the run to one source commit
    runs-on: ubuntu-latest
    # 20 since #663: the entries' check builds cargo-mutants from its source
    timeout-minutes: 20
    permissions:
      contents: read
      # The record the night carries from is a run artifact, read through the API.
      actions: read
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      mode: ${{ steps.plan.outputs.mode }}
      shards: ${{ steps.plan.outputs.shards }}
      max_parallel: ${{ steps.plan.outputs.max_parallel }}
      max_parallel_reason: ${{ steps.plan.outputs.max_parallel_reason }}
      matrix: ${{ steps.plan.outputs.matrix }}
      shards_tail: ${{ steps.plan.outputs.shards_tail }}
      max_parallel_tail: ${{ steps.plan.outputs.max_parallel_tail }}
      max_parallel_fuzz: ${{ steps.plan.outputs.max_parallel_fuzz }}
      matrix_tail: ${{ steps.plan.outputs.matrix_tail }}
    steps:
      # #629: the pin is the dispatch's commit (the input's, else github.sha,
      # which GitHub fixes when it creates the run), never the line's tip when
      # this job dequeues; the line is only asked whether it holds the commit.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.commit || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - id: source
        env:
          COMMIT: ${{ inputs.commit || github.sha }}
          LINE: ${{ github.ref_name }}
        run: python3 .github/scripts/nightly_mutants.py pin --commit "$COMMIT" --line "$LINE"

      - name: Check the scoreboard's failure cases
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_nightly_mutants.py' -v
        env:
          TMPDIR: ${{ runner.temp }}

      # The mutant listing below and a complete run's lockfile both need cargo.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable

      # #663: every .cargo/mutants.toml equivalence entry names exactly one
      # mutant of the pin's listing (`cargo mutants --list`, nothing built), or
      # the run is refused before any shard: a stale entry excludes nothing, its
      # mutant runs and survives, and the file reads below its true figure. The
      # same check as ci.yml's `checks` job; the message names the re-point.
      - name: Refuse a stale equivalence entry
        run: |
          python3 -B -m unittest discover -s .github/scripts -p 'test_mutants_entries.py'
          cargo install cargo-mutants --version "$CARGO_MUTANTS_VERSION" --locked \
            --root "$RUNNER_TEMP/tools" --target-dir "$RUNNER_TEMP/tool-target"
          PATH="$RUNNER_TEMP/tools/bin:$PATH" python3 .github/scripts/mutants_entries.py

      # The record is an artifact, never a commit: no write permission on beta,
      # no race with the sequencer. The newest `mutation-record` of the line
      # whose run measured an ancestor of the pin; none, and the night runs
      # complete.
      - name: Find the record the night carries from
        if: ${{ inputs.mode != 'complete' }}
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ steps.source.outputs.commit }}
          LINE: ${{ github.ref_name }}
        run: |
          python3 .github/scripts/nightly_mutants.py latest-record --line "$LINE" \
            --commit "$COMMIT" --dest "$RUNNER_TEMP/plan/base"

      - name: Plan the night by the reach rule
        id: plan
        env:
          COMMIT: ${{ steps.source.outputs.commit }}
          MODE: ${{ inputs.mode || 'incremental' }}
          # #791: the input over the window's figure; empty, the plan reads the hour.
          HEAVY_MAX_PARALLEL: ${{ inputs.heavy_max_parallel }}
        run: |
          mkdir -p "$RUNNER_TEMP/plan/base"
          python3 .github/scripts/nightly_mutants.py plan --commit "$COMMIT" --mode "$MODE" \
            --base-record "$RUNNER_TEMP/plan/base" --output "$RUNNER_TEMP/plan/plan.json" \
            --max-parallel "$HEAVY_MAX_PARALLEL"

      # This library does not commit Cargo.lock. A complete run resolves it once
      # here, so every shard builds one graph under `--locked` (#574); a night
      # builds the complete run's graph, kept in the record, so a crate released
      # since cannot move a carried figure's oracle unseen (a manifest change
      # re-measures everything with a fresh resolution).
      - name: Resolve or carry the mutation lockfile
        env:
          LOCKFILE: ${{ steps.plan.outputs.lockfile }}
        run: |
          if [[ "$LOCKFILE" == generate ]]; then
            cargo generate-lockfile
            cp Cargo.lock "$RUNNER_TEMP/plan/Cargo.lock"
          else
            want=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["complete_run"]["lockfile_sha256"])' "$RUNNER_TEMP/plan/base/record.json")
            have=$(sha256sum "$RUNNER_TEMP/plan/base/Cargo.lock" | cut -d' ' -f1)
            if [[ "$want" != "$have" ]]; then
              echo "::error::the record's Cargo.lock is not the complete run's ($have, not $want)"
              exit 1
            fi
            cp "$RUNNER_TEMP/plan/base/Cargo.lock" "$RUNNER_TEMP/plan/Cargo.lock"
          fi

      - name: Upload the plan
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mutation-plan
          path: ${{ runner.temp }}/plan/
          if-no-files-found: error
          retention-days: 30

  mutants:
    name: Mutants (${{ matrix.surface }}, ${{ matrix.shard }})
    runs-on: ubuntu-latest
    needs: source
    # An empty plan (a night of documentation) runs no shard; the score job
    # carries every figure.
    if: ${{ needs.source.outputs.shards != '0' }}
    timeout-minutes: 360
    permissions:
      contents: read
    # The plan's matrix (cut 7). The complete run is twenty-three shards (the
    # plan's COMPLETE_SHARDS: twenty since the keeper's cut 5, three more for
    # #703's ceiling), each one job on its own runner under the memory ceiling
    # below, the fuzz targets after them at the same figure.
    # The heavy-run cap by window (#791, the owner's word of 2026-11-04 17:1xZ
    # through the keeper, amending the fleet's cap of six of 10:0xZ 2026-11-03):
    # a heavy run takes up to 14 of the account's twenty slots inside its own
    # window (this crate's: 01:00Z to 09:00Z, the 07:00Z slot and the pin-chain
    # dispatches) when no other heavy run of the account is scheduled there, 6
    # otherwise; the dispatch input `heavy_max_parallel` overrides it for one run
    # (1 to 20). GitHub reads no `env` in `strategy`, so the figure lives in one
    # place, the plan's heavy_max_parallel and HEAVY_WINDOWS
    # (.github/scripts/nightly_mutants.py), read here through the pin job's
    # `max_parallel` output, its `max_parallel_reason` beside it; its owner is
    # loop four's #675, which reads the account's occupancy from the API and
    # moves it. The waves the plan projects past the window's end are the tail,
    # `mutants-tail` below at six (#791's fold, the keeper's word of 18:0xZ); this
    # job's matrix is the window's waves, every shard when there is no tail.
    # tests/arch_nightly_cap.rs refuses this line removed or a literal.
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.source.outputs.max_parallel) }}
      matrix:
        include: ${{ fromJSON(needs.source.outputs.matrix) }}
    env:
      SURFACE: ${{ matrix.surface }}
      SHARD: ${{ matrix.shard }}
      LABEL: ${{ matrix.label }}
      SOURCE_COMMIT: ${{ needs.source.outputs.commit }}
      # The conformance suites in the script, BEEF and Merkle selections skip
      # without the corpus, so the oracle reads it as ci.yml's vectors step does,
      # at the commit the pinned totals were audited against (#602, #31). The
      # runner hands its environment to cargo-mutants, which hands it to every
      # test run in its copy of the tree; the path is the checkout's, not the copy's.
      BSV_CONFORMANCE_DIR: ${{ github.workspace }}/ts-stack/conformance
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false

      - name: Check out the ts-stack conformance corpus
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: bsv-blockchain/ts-stack
          ref: edf6e03dad39bd7bc4fc6e73e64de3a2b6f805c9
          path: ts-stack
          sparse-checkout: conformance
          persist-credentials: false

      - name: Assert the corpus is present
        run: test -f "$BSV_CONFORMANCE_DIR/META.json"

      - name: Prepare external build directories
        run: |
          mkdir -p "$RUNNER_TEMP/mutants-tmp" "$RUNNER_TEMP/mutants-target" "$RUNNER_TEMP/tools"
          echo "TMPDIR=$RUNNER_TEMP/mutants-tmp" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/mutants-target" >> "$GITHUB_ENV"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable

      - name: Build cargo-mutants from its versioned source
        run: |
          cargo install cargo-mutants --version "$CARGO_MUTANTS_VERSION" --locked \
            --root "$RUNNER_TEMP/tools" --target-dir "$RUNNER_TEMP/tool-target"
          echo "$RUNNER_TEMP/tools/bin" >> "$GITHUB_PATH"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: mutation-plan
          path: ${{ runner.temp }}/plan

      # This library does not commit Cargo.lock: the plan's (resolved once by
      # the source job, or carried from the complete run) goes into the
      # checkout, so the copy cargo-mutants makes carries it and the baseline
      # and every mutant of every shard build one graph under `--locked` (#574).
      - name: Place the mutation lockfile
        run: cp "$RUNNER_TEMP/plan/Cargo.lock" Cargo.lock

      # A mutant that stops a parser's position advancing (`+=` to `*=` in
      # `Script::from_asm`, `Script::parse_chunks`, the HTTP substrate's
      # `Snapshot::read`) pushes on every pass and grew past 12 GB within
      # 25 seconds, well inside the test timeout: the 16 GB hosted runner ran
      # out and was shut down, deterministically at one mutant (#577). Cargo
      # runs every test binary through this runner, under `ulimit -v`, so the
      # allocation past the ceiling aborts the binary and the mutant is caught;
      # rustc and the build scripts are not run through it. The ceiling: an
      # unbounded Vec doubles, so a ceiling of C lets the process touch up to
      # about C before its next reserve fails; with the system, cargo and
      # cargo-mutants resident, C must sit well under half the runner's 16 GB.
      # 12,000,000 KB did not (run 41288213777 lost script 1/4 at
      # `script.rs:210:17` under it: the 8 GiB reserve succeeded and was
      # touched). 4,000,000 KB (3.8 GiB) leaves the five surfaces' baselines,
      # which peak at 805 MB of address space in one test binary, fivefold room,
      # and the culprits fail their first reserve past it.
      - name: Hold the test binaries under a memory ceiling
        run: |
          echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER=$GITHUB_WORKSPACE/.github/scripts/test-runner-memory-ceiling.sh" >> "$GITHUB_ENV"
          echo "MUTANTS_TEST_VMEM_KB=4000000" >> "$GITHUB_ENV"

      # The hook must be seen to reach a test binary before any mutant runs:
      # the runner writes the limit in force to MUTANTS_CEILING_MARKER, and one
      # cheap test run through cargo (the library's test list, the oracle's
      # features and lock, the job's target directory) must leave the marker
      # holding MUTANTS_TEST_VMEM_KB. The variable is this step's alone, so no
      # mutant's run writes it.
      - name: Prove the memory ceiling reaches the test binaries
        env:
          MUTANTS_CEILING_MARKER: ${{ runner.temp }}/ceiling-live
        run: |
          rm -f "$MUTANTS_CEILING_MARKER"
          cargo test --features full,http --locked --lib -- --list > /dev/null
          if [[ ! -f "$MUTANTS_CEILING_MARKER" ]]; then
            echo "::error::the test runner hook did not run: no test binary went through test-runner-memory-ceiling.sh"
            exit 1
          fi
          limit=$(cat "$MUTANTS_CEILING_MARKER")
          if [[ "$limit" != "$MUTANTS_TEST_VMEM_KB" ]]; then
            echo "::error::the test binaries ran under ulimit -v $limit, not $MUTANTS_TEST_VMEM_KB"
            exit 1
          fi
          echo "the test binaries run under ulimit -v $limit KB"

      - name: Run the scoped tests on every mutant
        run: |
          status=0
          python3 .github/scripts/nightly_mutants.py run \
            --surface "$SURFACE" --shard "$SHARD" --commit "$SOURCE_COMMIT" \
            --plan "$RUNNER_TEMP/plan/plan.json" \
            --output "$RUNNER_TEMP/mutations/$LABEL" || status=$?
          # Misses (2) and timeouts (3) are judged by the per-file floor below.
          # Inside `run`, each mutant the pass timed out is re-run once alone
          # (#781: the baseline re-timed, under this job's timeout-minutes);
          # a second timeout is a row outside the score's denominator.
          # Baseline, setup and runner failures remain failures of this job.
          if [[ "$status" != 0 && "$status" != 2 && "$status" != 3 ]]; then
            exit "$status"
          fi

      # The re-runs' outcomes and one-line diffs are kept, no mutant log (#781).
      - name: Package the outcomes and mutant diffs
        if: always()
        run: |
          python3 .github/scripts/nightly_mutants.py package \
            --run "$RUNNER_TEMP/mutations/$LABEL" \
            --output "$RUNNER_TEMP/mutation-artifact"

      - name: Upload mutation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mutants-${{ matrix.label }}
          path: ${{ runner.temp }}/mutation-artifact/
          if-no-files-found: error
          retention-days: 30

  # The tail (#791's fold, the keeper's word of 2026-11-04 18:0xZ): "a run
  # overrunning its window drops to six for the waves after the window's end".
  # The plan projects each wave of the window's figure from the last complete
  # record's shard minutes in the tree (`split_tail`); the shards whose wave is
  # projected past 09:00Z run here, after the window's job, at the plan's
  # `max_parallel_tail` (six), never fourteen into the day or the CLI's window.
  # The same steps as `mutants` (tests/arch_nightly_cap.rs pins them byte for
  # byte), the same artifact names, so the score reads one `mutants-<label>` per
  # shard whichever job ran it. `!cancelled()`, not `always()` (the cap rule of
  # #709): a red shard in the window still runs the tail; a cancelled run does not.
  mutants-tail:
    name: Mutants tail (${{ matrix.surface }}, ${{ matrix.shard }})
    runs-on: ubuntu-latest
    needs: [source, mutants]
    if: ${{ !cancelled() && needs.source.result == 'success' && needs.source.outputs.shards_tail != '0' }}
    timeout-minutes: 360
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.source.outputs.max_parallel_tail) }}
      matrix:
        include: ${{ fromJSON(needs.source.outputs.matrix_tail) }}
    env:
      SURFACE: ${{ matrix.surface }}
      SHARD: ${{ matrix.shard }}
      LABEL: ${{ matrix.label }}
      SOURCE_COMMIT: ${{ needs.source.outputs.commit }}
      # The conformance suites in the script, BEEF and Merkle selections skip
      # without the corpus, so the oracle reads it as ci.yml's vectors step does,
      # at the commit the pinned totals were audited against (#602, #31). The
      # runner hands its environment to cargo-mutants, which hands it to every
      # test run in its copy of the tree; the path is the checkout's, not the copy's.
      BSV_CONFORMANCE_DIR: ${{ github.workspace }}/ts-stack/conformance
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false

      - name: Check out the ts-stack conformance corpus
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: bsv-blockchain/ts-stack
          ref: edf6e03dad39bd7bc4fc6e73e64de3a2b6f805c9
          path: ts-stack
          sparse-checkout: conformance
          persist-credentials: false

      - name: Assert the corpus is present
        run: test -f "$BSV_CONFORMANCE_DIR/META.json"

      - name: Prepare external build directories
        run: |
          mkdir -p "$RUNNER_TEMP/mutants-tmp" "$RUNNER_TEMP/mutants-target" "$RUNNER_TEMP/tools"
          echo "TMPDIR=$RUNNER_TEMP/mutants-tmp" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/mutants-target" >> "$GITHUB_ENV"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable

      - name: Build cargo-mutants from its versioned source
        run: |
          cargo install cargo-mutants --version "$CARGO_MUTANTS_VERSION" --locked \
            --root "$RUNNER_TEMP/tools" --target-dir "$RUNNER_TEMP/tool-target"
          echo "$RUNNER_TEMP/tools/bin" >> "$GITHUB_PATH"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: mutation-plan
          path: ${{ runner.temp }}/plan

      # This library does not commit Cargo.lock: the plan's (resolved once by
      # the source job, or carried from the complete run) goes into the
      # checkout, so the copy cargo-mutants makes carries it and the baseline
      # and every mutant of every shard build one graph under `--locked` (#574).
      - name: Place the mutation lockfile
        run: cp "$RUNNER_TEMP/plan/Cargo.lock" Cargo.lock

      # A mutant that stops a parser's position advancing (`+=` to `*=` in
      # `Script::from_asm`, `Script::parse_chunks`, the HTTP substrate's
      # `Snapshot::read`) pushes on every pass and grew past 12 GB within
      # 25 seconds, well inside the test timeout: the 16 GB hosted runner ran
      # out and was shut down, deterministically at one mutant (#577). Cargo
      # runs every test binary through this runner, under `ulimit -v`, so the
      # allocation past the ceiling aborts the binary and the mutant is caught;
      # rustc and the build scripts are not run through it. The ceiling: an
      # unbounded Vec doubles, so a ceiling of C lets the process touch up to
      # about C before its next reserve fails; with the system, cargo and
      # cargo-mutants resident, C must sit well under half the runner's 16 GB.
      # 12,000,000 KB did not (run 41288213777 lost script 1/4 at
      # `script.rs:210:17` under it: the 8 GiB reserve succeeded and was
      # touched). 4,000,000 KB (3.8 GiB) leaves the five surfaces' baselines,
      # which peak at 805 MB of address space in one test binary, fivefold room,
      # and the culprits fail their first reserve past it.
      - name: Hold the test binaries under a memory ceiling
        run: |
          echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER=$GITHUB_WORKSPACE/.github/scripts/test-runner-memory-ceiling.sh" >> "$GITHUB_ENV"
          echo "MUTANTS_TEST_VMEM_KB=4000000" >> "$GITHUB_ENV"

      # The hook must be seen to reach a test binary before any mutant runs:
      # the runner writes the limit in force to MUTANTS_CEILING_MARKER, and one
      # cheap test run through cargo (the library's test list, the oracle's
      # features and lock, the job's target directory) must leave the marker
      # holding MUTANTS_TEST_VMEM_KB. The variable is this step's alone, so no
      # mutant's run writes it.
      - name: Prove the memory ceiling reaches the test binaries
        env:
          MUTANTS_CEILING_MARKER: ${{ runner.temp }}/ceiling-live
        run: |
          rm -f "$MUTANTS_CEILING_MARKER"
          cargo test --features full,http --locked --lib -- --list > /dev/null
          if [[ ! -f "$MUTANTS_CEILING_MARKER" ]]; then
            echo "::error::the test runner hook did not run: no test binary went through test-runner-memory-ceiling.sh"
            exit 1
          fi
          limit=$(cat "$MUTANTS_CEILING_MARKER")
          if [[ "$limit" != "$MUTANTS_TEST_VMEM_KB" ]]; then
            echo "::error::the test binaries ran under ulimit -v $limit, not $MUTANTS_TEST_VMEM_KB"
            exit 1
          fi
          echo "the test binaries run under ulimit -v $limit KB"

      - name: Run the scoped tests on every mutant
        run: |
          status=0
          python3 .github/scripts/nightly_mutants.py run \
            --surface "$SURFACE" --shard "$SHARD" --commit "$SOURCE_COMMIT" \
            --plan "$RUNNER_TEMP/plan/plan.json" \
            --output "$RUNNER_TEMP/mutations/$LABEL" || status=$?
          # Misses (2) and timeouts (3) are judged by the per-file floor below.
          # Inside `run`, each mutant the pass timed out is re-run once alone
          # (#781: the baseline re-timed, under this job's timeout-minutes);
          # a second timeout is a row outside the score's denominator.
          # Baseline, setup and runner failures remain failures of this job.
          if [[ "$status" != 0 && "$status" != 2 && "$status" != 3 ]]; then
            exit "$status"
          fi

      # The re-runs' outcomes and one-line diffs are kept, no mutant log (#781).
      - name: Package the outcomes and mutant diffs
        if: always()
        run: |
          python3 .github/scripts/nightly_mutants.py package \
            --run "$RUNNER_TEMP/mutations/$LABEL" \
            --output "$RUNNER_TEMP/mutation-artifact"

      - name: Upload mutation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mutants-${{ matrix.label }}
          path: ${{ runner.temp }}/mutation-artifact/
          if-no-files-found: error
          retention-days: 30

  mutation-score:
    name: Mutation score floor
    needs: [source, mutants, mutants-tail]
    if: ${{ always() && needs.source.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: mutation-plan
          path: ${{ runner.temp }}/plan

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: ${{ needs.source.outputs.shards != '0' }}
        with:
          pattern: mutants-*
          path: ${{ runner.temp }}/mutation-results
          merge-multiple: true

      # #602: 80% on the gate paths (src/script/**, src/transaction/beef*.rs,
      # src/transaction/merkle_path.rs, src/transaction/merkle_path_walk.rs, #93); elsewhere the floor is the checked-out
      # ratchet record's `mutation_floors` member, the measured score rounded
      # down with its improvement issue, which `tools/ratchet/run --check
      # --against` refuses to lower or remove. Cut 7: the night's files are
      # judged as before; a carried figure below its floor is listed with its
      # run, a finding and never a failure of the night. The merged record (every
      # file's figure, `night` or `carried`, with its run's id and sha) is the
      # `mutation-record` artifact the next night carries from.
      - name: Publish every file's score and enforce its floor
        if: always()
        env:
          SOURCE_COMMIT: ${{ needs.source.outputs.commit }}
        run: |
          mkdir -p "$RUNNER_TEMP/mutation-results" "$RUNNER_TEMP/record"
          python3 .github/scripts/nightly_mutants.py report \
            --input "$RUNNER_TEMP/mutation-results" --plan "$RUNNER_TEMP/plan/plan.json" \
            --base-record "$RUNNER_TEMP/plan/base" --lockfile "$RUNNER_TEMP/plan/Cargo.lock" \
            --record-output "$RUNNER_TEMP/record/record.json" \
            --floors docs/ratchets.json --commit "$SOURCE_COMMIT" \
            --output "$RUNNER_TEMP/mutation-summary.json"

      # 90 days, the longest an artifact is kept: a night re-uploads the whole
      # record, so the chain lives while a run lands inside each 90 days.
      - name: Upload the record
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mutation-record
          path: ${{ runner.temp }}/record/
          if-no-files-found: ignore
          retention-days: 90

      - name: Upload the scoreboard
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mutation-summary
          path: |
            ${{ runner.temp }}/mutation-summary.json
            ${{ runner.temp }}/mutation-summary.md
          if-no-files-found: error
          retention-days: 30

  fuzz:
    name: fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    # After the mutant shards and their tail (whatever their result), at the
    # plan's `max_parallel_fuzz`: the window's figure, six after a tail (see `mutants`).
    needs: [source, mutants, mutants-tail]
    if: ${{ !cancelled() && needs.source.result == 'success' }}
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      # The plan's figure for the stage after the last shard (#791: 14 inside the
      # run's window, 6 outside, the dispatch input over both; since the fold, 6
      # after a tail, which ends past the window; its owner loop four's #675;
      # tests/arch_nightly_cap.rs refuses a literal here).
      max-parallel: ${{ fromJSON(needs.source.outputs.max_parallel_fuzz) }}
      matrix:
        target:
          - fuzz_auth_messages
          - fuzz_base58
          - fuzz_beef_parser
          - fuzz_bip32
          - fuzz_bip39
          - fuzz_bsm
          - fuzz_chain_primitives
          - fuzz_ecies
          - fuzz_http_json_responses
          - fuzz_merkle_path
          - fuzz_messages_encrypted
          - fuzz_messages_signed
          - fuzz_script_parser
          - fuzz_script_spend
          - fuzz_script_spend_default
          - fuzz_shamir_backup
          - fuzz_signature_der
          - fuzz_transaction_parser
          - fuzz_wire_decoders
          - fuzz_wire_protocol
        # The default-mode spend target is built without a sanitizer
        # (bsv-rs#398): its subject is the interpreter's budget arithmetic and
        # refusals, a panic or an abort libFuzzer catches without one, and
        # AddressSanitizer's shadow and quarantine take a legitimate run under
        # its 128 MiB budget past libFuzzer's 2,048 MB RSS limit (an 8 MiB
        # squaring chain: 2,247 MB under ASan, an `oom` artifact that is the
        # sanitizer's accounting; 133 MB without). Every other target keeps
        # AddressSanitizer.
        include:
          - target: fuzz_script_spend_default
            sanitizer: none
    env:
      FUZZ_SANITIZER: ${{ matrix.sanitizer || 'address' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: ${{ env.FUZZ_TOOLCHAIN }}

      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            fuzz/target
          key: ${{ runner.os }}-fuzz-${{ env.FUZZ_TOOLCHAIN }}-${{ hashFiles('Cargo.toml', 'fuzz/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-fuzz-${{ env.FUZZ_TOOLCHAIN }}-

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version "$CARGO_FUZZ_VERSION" --locked --root "$RUNNER_TEMP/tools"

      - name: Build the target
        run: |
          export PATH="$RUNNER_TEMP/tools/bin:$PATH"
          cargo fuzz build -O -s "$FUZZ_SANITIZER" "${{ matrix.target }}"

      # FUZZ_MINUTES from the checked-in corpus (cut 7). New entries are
      # written to $RUNNER_TEMP/new (the leading corpus directory); a crash's
      # input to $RUNNER_TEMP/artifacts, and the run goes on (-ignore_crashes).
      - name: Fuzz for the night's budget
        run: |
          export PATH="$RUNNER_TEMP/tools/bin:$PATH"
          mkdir -p "$RUNNER_TEMP/new" "$RUNNER_TEMP/artifacts" "fuzz/corpus/${{ matrix.target }}"
          status=0
          cargo fuzz run -O -s "$FUZZ_SANITIZER" "${{ matrix.target }}" "$RUNNER_TEMP/new" "fuzz/corpus/${{ matrix.target }}" -- \
            -fork=2 -ignore_crashes=1 -max_total_time=$((FUZZ_MINUTES * 60)) \
            -artifact_prefix="$RUNNER_TEMP/artifacts/" > "$RUNNER_TEMP/fuzz.log" 2>&1 || status=$?
          tail -n 40 "$RUNNER_TEMP/fuzz.log"
          echo "libFuzzer exited $status (a crash is judged by the next steps)"
          echo "new corpus entries: $(find "$RUNNER_TEMP/new" -type f | wc -l)" >> "$GITHUB_STEP_SUMMARY"

      # The repository does not let a workflow open a pull request (Settings,
      # Actions, "Allow GitHub Actions to create and approve pull requests" is
      # off), so the new entries are an artifact; the captain merges them with
      # `cargo fuzz cmin` (docs/NIGHTLY.md).
      - name: Upload the new corpus entries
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: corpus-${{ matrix.target }}
          path: ${{ runner.temp }}/new
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload the crash inputs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: crashes-${{ matrix.target }}
          path: ${{ runner.temp }}/artifacts
          if-no-files-found: ignore
          retention-days: 90

      # A crash is an issue: one per target and panic site, the input
      # attached as base64 and the panic's tail; a site with an open issue
      # gets a comment with the night's run instead of a second issue. The
      # job then fails, so the night's summary shows it.
      - name: File the crashes
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET: ${{ matrix.target }}
          # The commit the job checked out; on a schedule $GITHUB_SHA is the
          # default branch's, not beta's.
          SOURCE_COMMIT: ${{ needs.source.outputs.commit }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          shopt -s nullglob
          bin="fuzz/target/x86_64-unknown-linux-gnu/release/$TARGET"
          found=0
          declare -A filed
          for input in "$RUNNER_TEMP"/artifacts/crash-* "$RUNNER_TEMP"/artifacts/oom-* "$RUNNER_TEMP"/artifacts/timeout-*; do
            found=1
            kind="$(basename "$input" | cut -d- -f1)"
            tail="$("$bin" "$input" 2>&1 | grep -A4 -E 'panicked at|ERROR: libFuzzer|SUMMARY' | head -n 12 || true)"
            site="$(printf '%s\n' "$tail" | grep -oE 'panicked at [^ ]+' | head -n 1 | sed 's/^panicked at //; s/:$//')"
            # A site in the crate is printed under the checkout; the title
            # carries its repository-relative path.
            site="${site#"$GITHUB_WORKSPACE"/}"
            [ -n "$site" ] || site="$kind"
            title="fuzz: $TARGET: $site"
            [ -z "${filed[$title]:-}" ] || continue
            filed[$title]=1
            body="$RUNNER_TEMP/body.md"
            {
              echo "Found by the nightly fuzz job: $RUN_URL (artifact \`crashes-$TARGET\`, file \`$(basename "$input")\`)."
              echo
              echo "Source $SOURCE_COMMIT, $FUZZ_TOOLCHAIN, cargo-fuzz $CARGO_FUZZ_VERSION"
              echo
              echo "## The panic's tail"
              echo
              echo '```'
              printf '%s\n' "$tail"
              echo '```'
              echo
              echo "## The input ($(wc -c < "$input") bytes, base64)"
              echo
              echo '```'
              if [ "$(wc -c < "$input")" -le 4096 ]; then base64 -w 76 "$input"; else echo "over 4096 bytes: in the artifact"; fi
              echo '```'
              echo
              echo "Reproduce: \`cargo fuzz run $TARGET <the input>\`. Fixed with a test that was red before it (CLAUDE.md rule 2)."
            } > "$body"
            number="$(gh issue list --state open --search "in:title \"$title\"" --json number,title \
              --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)"
            if [ -n "$number" ]; then
              gh issue comment "$number" --body "Seen again by the nightly fuzz job: $RUN_URL"
            else
              gh issue create --title "$title" --body-file "$body"
            fi
          done
          if [ "$found" = 1 ]; then
            echo "crashes found: see the issues and the crashes-$TARGET artifact" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
