name: Features

# Every feature builds alone, and the five wasm32 library slices other than the required
# `wasm32 (combined)` (ci.yml's, on every event). Off the push run (ci.yml runs the required
# set, nothing more; the owner's word of 2026-10-27); on demand (`gh workflow run features.yml
# --ref <line>`) and called by release.yml on every version tag before it publishes.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

# a newer dispatch on the same ref waits for the one running; a tag's call is never cancelled
concurrency:
  group: features-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Each feature must build without dev-dependency feature unification (#80).
  features:
    name: features
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Put build output in runner scratch
        run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/bsv-rs-features" >> "$GITHUB_ENV"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable

      - name: Build cargo-hack 0.6.45 from source
        env:
          RUSTFLAGS: ""
        run: cargo install cargo-hack --version 0.6.45 --locked --root "$RUNNER_TEMP/tools"

      - name: Check every feature without dev dependencies
        run: PATH="$RUNNER_TEMP/tools/bin:$PATH" cargo hack check --each-feature --no-dev-deps

  # The five library slices the Workers consume beside the combined one, not full applications.
  # Keep dead code in a diagnostic cdylib so the size is not an empty module.
  # #96 will define the deployment artifact and its size budget. An `include` row naming a
  # consumer the list lacks would add a cell, so each consumer's features are the step's table
  wasm32-slices:
    name: wasm32 (${{ matrix.consumer }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        consumer: [watchtower, monitor, chaintracks, overlay, relay]
    env:
      SLICE_NAME: ${{ matrix.consumer }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Select the consumer's features
        run: |
          case "$SLICE_NAME" in
            watchtower) features=wallet,auth,transaction,wasm ;;
            monitor) features=transaction,wasm ;;
            chaintracks) features=block ;;
            overlay) features=overlay,wasm ;;
            relay) features=auth,socketio,wasm ;;
            *) echo "::error::no feature slice for consumer $SLICE_NAME"; exit 1 ;;
          esac
          echo "SLICE_FEATURES=$features" >> "$GITHUB_ENV"

      - name: Put build output in runner scratch
        run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/bsv-rs-wasm32" >> "$GITHUB_ENV"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Build the library slice
        run: cargo build --lib --target wasm32-unknown-unknown --no-default-features --features "$SLICE_FEATURES"

      - name: Measure the diagnostic wasm artifact
        run: |
          cargo rustc --lib --crate-type cdylib --target wasm32-unknown-unknown --no-default-features --features "$SLICE_FEATURES" -- -C link-dead-code=yes
          artifact="$CARGO_TARGET_DIR/wasm32-unknown-unknown/debug/bsv_rs.wasm"
          bytes=$(wc -c < "$artifact")
          printf '%s: %s bytes (debug cdylib, dead code retained)\n' "$SLICE_NAME" "$bytes"
