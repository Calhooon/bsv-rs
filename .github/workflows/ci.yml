name: CI

on:
  push:
    branches: [main, beta]
  pull_request:
    branches: [main, beta]
  # sync-main-into-beta.yml starts the suite on its PR's branch: a PR or a push made with the
  # GITHUB_TOKEN starts no workflow, a workflow_dispatch does
  workflow_dispatch:
  # release.yml runs these same jobs on a version tag before it publishes
  workflow_call:
    secrets:
      DEPENDENTS_READ_TOKEN:
        description: Read-only access to the private consumers in docs/dependents.lock
        required: false
      BSV_SCRIPT_CORPUS_TOKEN:
        description: Read-only access to the private seed corpus the benchmarks job reads (a tag's call skips that job)
        required: false

permissions:
  contents: read

# a newer push to the same branch or PR cancels the run it supersedes; a tag's run is never cancelled
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  dependents-plan:
    name: Plan pinned dependents
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Test the dependent selector and resolution guard
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_dependents.py'

      - name: Select the pins that admit this version
        id: plan
        env:
          # a private row is planned only when the read token exists (a fork PR never has it)
          HAS_READ_TOKEN: ${{ secrets.DEPENDENTS_READ_TOKEN != '' }}
        run: python3 -B .github/scripts/dependents.py plan --sdk "$GITHUB_WORKSPACE" --output "$GITHUB_OUTPUT"

  dependent-check:
    name: dependent (${{ matrix.id }})
    needs: dependents-plan
    if: needs.dependents-plan.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.dependents-plan.outputs.matrix) }}
    steps:
      - name: Keep build output in runner scratch
        run: |
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/dependents-target" >> "$GITHUB_ENV"
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"

      # Sibling checkouts keep the downstream and its generated lock outside
      # the SDK tree. Neither checkout retains a credential.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: sdk
          persist-credentials: false

      - name: Require read access for a private consumer
        if: matrix.private
        env:
          READ_TOKEN: ${{ secrets.DEPENDENTS_READ_TOKEN }}
        run: |
          if [ -z "$READ_TOKEN" ]; then
            echo '::error::Private dependents require the DEPENDENTS_READ_TOKEN read-only repository secret; the captain must request access from the owner.'
            exit 1
          fi

      - name: Check out the locked default-branch revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.rev }}
          path: consumer
          token: ${{ matrix.private && secrets.DEPENDENTS_READ_TOKEN || github.token }}
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Check the consumer against the PR tree
        env:
          CONSUMER: ${{ matrix.id }}
        run: python3 -B sdk/.github/scripts/dependents.py run --sdk "$GITHUB_WORKSPACE/sdk" --checkout "$GITHUB_WORKSPACE/consumer" --consumer "$CONSUMER"

  dependents:
    name: dependents
    needs: [dependents-plan, dependent-check]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every eligible consumer check
        env:
          PLAN_RESULT: ${{ needs.dependents-plan.result }}
          CHECK_RESULT: ${{ needs.dependent-check.result }}
          CONSUMER_COUNT: ${{ needs.dependents-plan.outputs.count }}
        run: |
          if [ "$PLAN_RESULT" != success ]; then
            echo '::error::The dependents plan failed or was cancelled.'
            exit 1
          fi
          if [ "$CONSUMER_COUNT" != 0 ] && [ "$CHECK_RESULT" != success ]; then
            echo '::error::An eligible dependent failed or was cancelled; see the named consumer check.'
            exit 1
          fi
          echo "All $CONSUMER_COUNT eligible consumer checks passed."

  semver:
    name: semver
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Keep build output in runner scratch
        run: |
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/semver-target" >> "$GITHUB_ENV"
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install the Rust version supported by the pinned semver tool
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: 1.95.0

      - name: Cache the pinned semver tool
        id: semver-tool
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/tools
          key: semver-checks-0.51.0-rust-1.95.0-${{ runner.os }}-${{ runner.arch }}

      - name: Install cargo-semver-checks 0.51.0
        if: steps.semver-tool.outputs.cache-hit != 'true'
        env:
          RUSTFLAGS: ""
        run: cargo install cargo-semver-checks --version 0.51.0 --locked --root "$RUNNER_TEMP/tools"

      - name: Check against the last tag reachable from the PR base
        env:
          BASE_REV: ${{ github.event.pull_request.base.sha }}
        run: |
          baseline="$(git describe --tags --abbrev=0 --match 'v[0-9]*' "$BASE_REV")"
          echo "Checking the PR against $baseline (base $BASE_REV)"
          git clone --quiet --shared "$GITHUB_WORKSPACE" "$RUNNER_TEMP/semver-source"
          cd "$RUNNER_TEMP/semver-source"
          # A 0.x minor or a beta suffix must not waive breaking API changes.
          # The release type is inferred from the version change between the baseline tag and
          # Cargo.toml (a 0.x minor bump is semver's major): a breaking change passes only when the
          # version says so, an additive one only when it says at least minor (#87's 0.9.0).
          "$RUNNER_TEMP/tools/bin/cargo-semver-checks" check-release --baseline-rev "$baseline" --all-features

  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, beta]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: ${{ matrix.rust }}

      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.rust }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.rust }}-

      - name: Run unit tests
        run: cargo test --lib --all-features --verbose

      # Every integration binary, on the feature set the lanes' gates and
      # CLAUDE.md's numbers use (dhat-profiling stays out: its global
      # allocator is why memory_profiling runs alone below). An enumerated
      # list of binaries drifted to 34 of 73 files (#146).
      - name: Run every integration test
        run: cargo test --features "full,http,websocket" --tests --no-fail-fast --verbose

      - name: Run the memory profiling tests
        run: cargo test --test memory_profiling --all-features --verbose -- --test-threads=1

      # The `tracing` sink (#212) is outside `full`: its event, and the wire's
      # frames with the feature on, the same bytes as without it.
      - name: Run the tracing sink tests
        run: cargo test --features "full,http,tracing" --test wire_tracing_sink --test wire_error_frames --test fixtures_replay --verbose

      - name: Run doc tests
        run: cargo test --doc --all-features

  fixtures:
    name: fixtures
    runs-on: ubuntu-latest
    env:
      BSV_FIXTURES_RECORD: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable

      - name: Keep build output outside the checkout
        run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/bsv-fixtures-target" >> "$GITHUB_ENV"

      - name: Cache cargo registry and fixture build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ runner.temp }}/bsv-fixtures-target
          key: ubuntu-fixtures-${{ hashFiles('**/Cargo.lock', 'Cargo.toml') }}

      # This library does not currently commit Cargo.lock. If a later lane
      # supplies it, use that lock unchanged; otherwise lock this job's resolve.
      - name: Resolve dependencies when no lock is committed
        run: test -f Cargo.lock || cargo generate-lockfile

      - name: Replay the public surface fixtures
        run: cargo test --features "full,http" --test fixtures_replay --locked

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
          components: clippy

      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ubuntu-clippy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ubuntu-clippy-

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      # Each published slice alone (#115): a function dead under one slice fails every consumer
      # that builds that slice with warnings denied, and --all-features never sees it.
      - name: Clippy on each slice alone
        run: |
          for slice in primitives block compat totp script transaction wallet \
                       "auth,wallet,transaction,overlay,socketio,wasm" "wallet,auth,transaction,wasm" \
                       "transaction,wasm" "overlay,wasm" "auth,socketio,wasm"; do
            echo "::group::$slice"
            cargo clippy --no-default-features --features "$slice" -- -D warnings
            echo "::endgroup::"
          done

  ratchet:
    name: ratchet
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Keep generated files outside the checkout
        run: |
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/bsv-rs-ratchet-target" >> "$GITHUB_ENV"
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/bsv-rs-ratchet-target"

      # Diagnostics are compiler-version dependent; keep the baseline's toolchain.
      - name: Install the measurement toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: "1.95.0"
          components: clippy, rustfmt

      - name: Cache the measurement build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.CARGO_TARGET_DIR }}
          key: ${{ runner.os }}-ratchet-1.95.0-${{ hashFiles('tools/ratchet/Cargo.lock', 'tools/ratchet/library.Cargo.lock') }}

      - name: Check the measurement tool
        run: |
          cargo +1.95.0 fmt --manifest-path tools/ratchet/Cargo.toml -- --check
          cargo +1.95.0 clippy --locked --manifest-path tools/ratchet/Cargo.toml --all-targets -- -D warnings
          cargo +1.95.0 test --locked --manifest-path tools/ratchet/Cargo.toml

      - name: Reject code-health increases
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_REF" ] && [ "$BASE_REF" != 0000000000000000000000000000000000000000 ]; then
            tools/ratchet/run --check --against "$BASE_REF"
          else
            tools/ratchet/run --check
          fi

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
          components: rustfmt

      # The root has no [workspace], so --all stops at the crate: the fuzz
      # crates are checked by manifest path, as the tools are (#180).
      - name: Check formatting
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path fuzz/Cargo.toml -- --check
          cargo fmt --manifest-path fuzz/corpus-gen/Cargo.toml -- --check

  # the conformance vectors as one named check (a required status on main): the shared JSON under
  # tests/vectors/ and the ts-stack corpus. The conformance files skip when the corpus is absent
  # (Calhooon/bsv-rs#31), so the corpus is checked out at the commit the pinned totals were audited
  # against (5,116 evaluation vectors) and its presence is asserted before the tests run
  vectors:
    name: vectors
    runs-on: ubuntu-latest
    env:
      BSV_CONFORMANCE_DIR: ${{ github.workspace }}/ts-stack/conformance
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check out the ts-stack conformance corpus
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: bsv-blockchain/ts-stack
          ref: edf6e03dad39bd7bc4fc6e73e64de3a2b6f805c9
          path: ts-stack
          sparse-checkout: conformance
          persist-credentials: false

      - name: Assert the corpus is present
        run: test -f "$BSV_CONFORMANCE_DIR/META.json"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable

      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ubuntu-vectors-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ubuntu-vectors-

      - name: Run the chain primitive vectors
        run: cargo test --all-features --test chain_primitives --test chain_difficulty --test chain_encoding --test canonical_varint --test hash_stream --test hkdf_wycheproof --verbose

      - name: Run the vector-backed tests
        run: cargo test --all-features --test conformance_beef --test conformance_scripts --test script_vectors_tests --test broadcaster_http_tests --test wallet_http_json_busy_tests --verbose -- --nocapture

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable

      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ubuntu-docs-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ubuntu-docs-

      - name: Build docs
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -Dwarnings

  # the workflows linted (bsv-stack-lean #145), shellcheck on every run script: actionlint is built
  # from its release source, the tarball pinned by sha256. Every `uses:` in ci.yml and release.yml
  # is pinned by a commit sha with its version beside it (#144)
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 454800bd4f854592bcfe79b161f71d56e35940eb7016e48a26dd356adc9d400a
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Build actionlint from its pinned source
        run: |
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tar.gz" "https://github.com/rhysd/actionlint/archive/refs/tags/v${ACTIONLINT_VERSION}.tar.gz"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/actionlint-${ACTIONLINT_VERSION}"
          go build -o "$RUNNER_TEMP/bin/actionlint" ./cmd/actionlint

      - name: Every action pinned by a commit sha
        run: |
          if grep -nE '^\s*-?\s*uses:' .github/workflows/*.yml | grep -vE 'uses: (\./|[^@ ]+@[0-9a-f]{40} # v)'; then
            echo "::error::a uses: line above is not pinned by a 40-hex commit sha with its version"
            exit 1
          fi

      - name: Lint the workflows
        run: '"$RUNNER_TEMP/bin/actionlint" -no-color'

  # the secrets scan (bsv-stack-lean #140): gitleaks over every commit of the checkout, the
  # values redacted; the findings judged not secrets are named by fingerprint in .gitleaksignore.
  # gitleaks is built from its release source, the tarball pinned by sha256 (no third-party action)
  secrets:
    name: secrets
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: e90fb266d75837e75894c778bf594ab8e2787f12dce5a62651f21b893eaf9abb
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build gitleaks from its pinned source
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" "https://github.com/gitleaks/gitleaks/archive/refs/tags/v${GITLEAKS_VERSION}.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/gitleaks-${GITLEAKS_VERSION}"
          go build -o "$RUNNER_TEMP/bin/gitleaks" .

      - name: Scan the history
        run: '"$RUNNER_TEMP/bin/gitleaks" git --redact --no-banner --exit-code 1 .'

  # nothing sits on main that beta lacks (RELEASING.md, "The direction rule"): every commit of
  # origin/main is on the tree (the PR's merge commit, beta's tip after a push, the sync branch on
  # a dispatch) by sha, by patch (git cherry), or by a cherry-pick link in either direction: main's
  # commit names a beta source on the tree, or a commit of the tree names main's. Main's commits
  # come back by sync-main-into-beta.yml's cherry-pick -x, landed by rebase merge (linear history)
  main-in-beta:
    name: main-in-beta
    if: >-
      (github.event_name == 'pull_request' && github.base_ref == 'beta') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/beta') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/sync/main-into-beta')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # the cold review's guard (PR #205); the logs are read into a variable, never piped into
      # grep -q: under pipefail a grep that stops early fails its writer with SIGPIPE (141)
      - name: Every commit of origin/main is on HEAD by sha, patch or cherry-pick link
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          base="$(git merge-base origin/main HEAD)"
          linked="$(git log --format=%B "$base..HEAD")"
          missing=()
          while read -r mark sha _; do
            [ "$mark" = "+" ] || continue                       # "-": a patch-equivalent commit is on HEAD
            src="$(git log -1 --format=%B "$sha" | sed -n 's/.*(cherry picked from commit \([0-9a-f]\{40\}\)).*/\1/p')"
            src="${src%%$'\n'*}"
            if [ -n "$src" ] && git merge-base --is-ancestor "$src" HEAD; then continue; fi   # main's commit names its beta source
            if grep -qF "(cherry picked from commit ${sha})" <<< "$linked"; then continue; fi   # a beta commit names it
            missing+=("$sha")
          done < <(git cherry HEAD origin/main)
          if [ "${#missing[@]}" -eq 0 ]; then
            echo "every commit of origin/main $(git rev-parse --short origin/main) is on $(git rev-parse --short HEAD) by sha, patch or cherry-pick link"
            exit 0
          fi
          echo "The commits main has that this tree lacks (no patch-equivalent, no cherry-pick link):"
          for sha in "${missing[@]}"; do git log -1 --oneline "$sha"; done
          echo "::error::main has ${#missing[@]} commit(s) beta lacks; cherry-pick each onto beta with -x through a PR (sync-main-into-beta.yml opens it from sync/main-into-beta) before this lands"
          exit 1

  # every fix is born on beta (RELEASING.md, "The direction rule"): each commit of a PR into main
  # is on origin/beta by sha, by patch, or by a cherry-pick link in either direction. A release
  # commit (Cargo.toml's version and CHANGELOG.md's headings, nothing else) is main-born by nature
  # and passes, said in the log
  beta-born:
    name: beta-born
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Every commit of the PR is on origin/beta by sha, patch or cherry-pick link
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin beta
          # a release commit: Cargo.toml and CHANGELOG.md alone, every changed line a package
          # version or a changelog heading, and a version among them
          release_commit() {
            local files changed
            files="$(git diff-tree --no-commit-id --name-only -r "$1")"
            [ -n "$files" ] || return 1
            while IFS= read -r file; do
              case "$file" in Cargo.toml | CHANGELOG.md) ;; *) return 1 ;; esac
            done <<< "$files"
            changed="$(git diff -U0 "$1^" "$1" | grep -E '^[-+]' | grep -vE '^(\+\+\+|---) ' || true)"
            grep -qE '^\+version = "' <<< "$changed" || return 1
            ! grep -qvE '^[-+](version = "[^"]*"|## \[(Unreleased|[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?)\]( - [0-9]{4}-[0-9]{2}-[0-9]{2})?)?$' <<< "$changed"
          }
          base="$(git merge-base "$PR_BASE" "$PR_HEAD")"
          linked="$(git log --format=%B "$(git merge-base origin/beta "$PR_HEAD")..origin/beta")"
          missing=()
          while read -r mark sha _; do
            [ "$mark" = "+" ] || continue                       # "-": a patch-equivalent commit is on beta
            src="$(git log -1 --format=%B "$sha" | sed -n 's/.*(cherry picked from commit \([0-9a-f]\{40\}\)).*/\1/p')"
            src="${src%%$'\n'*}"
            if [ -n "$src" ] && git merge-base --is-ancestor "$src" origin/beta; then continue; fi   # the PR's commit names its beta source
            if grep -qF "(cherry picked from commit ${sha})" <<< "$linked"; then continue; fi   # a beta commit names it
            if release_commit "$sha"; then
              echo "a release commit, main-born by nature (Cargo.toml's version and CHANGELOG.md's headings alone): $(git log -1 --oneline "$sha")"
              continue
            fi
            missing+=("$sha")
          done < <(git cherry origin/beta "$PR_HEAD" "$base")
          if [ "${#missing[@]}" -eq 0 ]; then
            echo "every commit of the PR ($(git rev-parse --short "$base")..$(git rev-parse --short "$PR_HEAD")) is on origin/beta $(git rev-parse --short origin/beta) by sha, patch or cherry-pick link, or a release commit"
            exit 0
          fi
          echo "The commits of this PR beta lacks (no patch-equivalent, no cherry-pick link, not a release commit):"
          for sha in "${missing[@]}"; do git log -1 --oneline "$sha"; done
          echo "::error::${#missing[@]} commit(s) of this PR were not born on beta; land each on beta through a PR, then cherry-pick it here with -x"
          exit 1

  # the declared rust-version (bsv-stack-lean #139): the library with every feature, native and
  # wasm32, on that toolchain, the dependencies resolved to versions it supports
  msrv:
    name: msrv
    runs-on: ubuntu-latest
    env:
      CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: "1.88.0"
          targets: wasm32-unknown-unknown

      - name: The manifest declares this toolchain
        run: grep -qx 'rust-version = "1.88"' Cargo.toml

      - name: Check the library
        run: cargo check --lib --all-features

      - name: Check the library on wasm32
        run: cargo check --lib --target wasm32-unknown-unknown --no-default-features --features "full,wasm"

  # Each feature must build without dev-dependency feature unification (#80).
  features:
    name: features
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Put build output in runner scratch
        run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/bsv-rs-features" >> "$GITHUB_ENV"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable

      - name: Build cargo-hack 0.6.45 from source
        env:
          RUSTFLAGS: ""
        run: cargo install cargo-hack --version 0.6.45 --locked --root "$RUNNER_TEMP/tools"

      - name: Check every feature without dev dependencies
        run: PATH="$RUNNER_TEMP/tools/bin:$PATH" cargo hack check --each-feature --no-dev-deps

  # These are the six library slices consumed by Workers, not full applications.
  # Keep dead code in a diagnostic cdylib so the size is not an empty module.
  # #96 will define the deployment artifact and its size budget.
  wasm32:
    name: wasm32 (${{ matrix.consumer }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - consumer: combined
            features: auth,wallet,transaction,overlay,socketio,wasm
          - consumer: watchtower
            features: wallet,auth,transaction,wasm
          - consumer: monitor
            features: transaction,wasm
          - consumer: chaintracks
            features: block
          - consumer: overlay
            features: overlay,wasm
          - consumer: relay
            features: auth,socketio,wasm
    env:
      SLICE_FEATURES: ${{ matrix.features }}
      SLICE_NAME: ${{ matrix.consumer }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Put build output in runner scratch
        run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/bsv-rs-wasm32" >> "$GITHUB_ENV"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Build the library slice
        run: cargo build --lib --target wasm32-unknown-unknown --no-default-features --features "$SLICE_FEATURES"

      # `http` is native-only (#152): the slice with it stops at build.rs, one message
      - name: The slice with http is refused at the build script
        if: matrix.consumer == 'combined'
        run: |
          if cargo build --lib --target wasm32-unknown-unknown --no-default-features --features "$SLICE_FEATURES,http" 2> "$RUNNER_TEMP/http.log"; then
            echo '::error::the wasm32 build with http succeeded; build.rs no longer refuses it (#152)'
            exit 1
          fi
          grep -F 'feature is native-only and does not build for wasm32' "$RUNNER_TEMP/http.log"
          ! grep -E '^error\[E[0-9]+\]|could not compile .bsv-rs. \(lib\)' "$RUNNER_TEMP/http.log"

      - name: Measure the diagnostic wasm artifact
        run: |
          cargo rustc --lib --crate-type cdylib --target wasm32-unknown-unknown --no-default-features --features "$SLICE_FEATURES" -- -C link-dead-code=yes
          artifact="$CARGO_TARGET_DIR/wasm32-unknown-unknown/debug/bsv_rs.wasm"
          bytes=$(wc -c < "$artifact")
          printf '%s: %s bytes (debug cdylib, dead code retained)\n' "$SLICE_NAME" "$bytes"

  # the unused dependencies (bsv-stack-lean #137): cargo-machete reads the manifests and the
  # sources of the crate and fuzz/, no build; non-blocking until a captain asks. The tool is
  # installed by version from crates.io with its own lock, without the workflow's -Dwarnings
  machete:
    name: unused dependencies
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable

      - name: Install cargo-machete 0.9.2
        env:
          RUSTFLAGS: ""
        run: cargo install cargo-machete --version 0.9.2 --locked --root "$RUNNER_TEMP/tools"

      - name: Run cargo-machete
        run: '"$RUNNER_TEMP/tools/bin/cargo-machete" --with-metadata'

  deny:
    name: deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Install cargo-deny 0.20.2
        env:
          RUSTFLAGS: ""
          CARGO_TARGET_DIR: ${{ runner.temp }}/cargo-deny-target
        run: cargo install cargo-deny --version 0.20.2 --locked --root "$RUNNER_TEMP/tools"

      # This library does not commit Cargo.lock. Resolve once, then keep that
      # same lockfile for all three graphs; every check must succeed.
      - name: Resolve the audit lockfile
        run: cargo generate-lockfile

      - name: Check all features, the Cloudflare slice and default features
        run: |
          result=0
          "$RUNNER_TEMP/tools/bin/cargo-deny" --locked --all-features check || result=1
          "$RUNNER_TEMP/tools/bin/cargo-deny" --locked --no-default-features --features "auth,wallet,transaction,overlay,socketio,wasm" --target wasm32-unknown-unknown check || result=1
          "$RUNNER_TEMP/tools/bin/cargo-deny" --locked check || result=1
          exit "$result"

  benchmarks:
    name: Benchmark Regression Check
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/beta')
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Keep benchmark output outside the checkout
        run: |
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/bsv-rs-bench-target" >> "$GITHUB_ENV"
          echo "BSV_SCRIPT_CORPUS=$RUNNER_TEMP/bsv-script-corpus" >> "$GITHUB_ENV"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable

      # The seed corpus's repository is private. Without the read-only token (a
      # fork, a PR from outside, a repository without the secret) script_spend
      # is skipped with a warning and bench-compare reports it as skipped, never
      # as a pass or a regression; the other eight benches are still compared.
      - name: Read the seed corpus at the lane's source revision
        env:
          GH_TOKEN: ${{ secrets.BSV_SCRIPT_CORPUS_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::script_spend skipped: BSV_SCRIPT_CORPUS_TOKEN not set (the script corpus is private)"
            echo "BENCH_SKIP=script_spend" >> "$GITHUB_ENV"
            exit 0
          fi
          mkdir -p "$BSV_SCRIPT_CORPUS"
          gh api --method GET -H 'Accept: application/vnd.github.raw+json' \
            'repos/Calgooon/bsv-script-lean/contents/corpus/seed/seed.jsonl?ref=8840488cc7922fa908ebcaa6333e885a49c6ca7c' \
            > "$BSV_SCRIPT_CORPUS/seed.jsonl"
          test -s "$BSV_SCRIPT_CORPUS/seed.jsonl"

      # This library does not commit Cargo.lock (the deny job's rule): resolve
      # once so the gate's `cargo bench --locked` measures one graph.
      - name: Resolve the benchmark lockfile
        run: cargo generate-lockfile

      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.CARGO_TARGET_DIR }}
          key: ${{ runner.os }}-bench-${{ hashFiles('Cargo.lock', 'tools/bench-compare/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-bench-

      - name: Test the comparison gate
        run: |
          cargo fmt --manifest-path tools/bench-compare/Cargo.toml -- --check
          cargo clippy --locked --all-targets --manifest-path tools/bench-compare/Cargo.toml -- -D warnings
          cargo test --locked --manifest-path tools/bench-compare/Cargo.toml

      # Record mode is explicit in the PR's description. Its artifact must be
      # reviewed and committed, then the marker removed for the comparison run.
      # Exit 3 is a runner whose platform/CPU/cores key has no baseline entry
      # yet: a warning naming the key, not a failure.
      - name: Compare p99, or record an explicitly requested baseline
        env:
          RECORD_BASELINE: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.body, '[bench-baseline-record]') }}
        run: |
          args=()
          if [ -n "${BENCH_SKIP:-}" ]; then
            args+=(--skip "$BENCH_SKIP")
          fi
          if [ "$RECORD_BASELINE" = 'true' ]; then
            cp benches/baseline.json "$RUNNER_TEMP/linux-baseline.json"
            args+=(--record --baseline "$RUNNER_TEMP/linux-baseline.json")
          fi
          set +e
          cargo run --locked --manifest-path tools/bench-compare/Cargo.toml -- \
            "${args[@]}" --output "$RUNNER_TEMP/bench-results" | tee "$RUNNER_TEMP/bench-compare.out"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 3 ]; then
            key=$(sed -n 's/^NO BASELINE ENTRY: //p' "$RUNNER_TEMP/bench-compare.out")
            echo "::warning::no baseline entry for $key: record one with [bench-baseline-record]"
            exit 0
          fi
          exit "$status"

      - name: Retain measurements and any proposed baseline
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: benchmark-evidence-${{ runner.os }}
          path: |
            ${{ runner.temp }}/bench-results/run.json
            ${{ runner.temp }}/bench-results/baseline.json
            ${{ runner.temp }}/bench-results/bench.log
            ${{ runner.temp }}/linux-baseline.json
          if-no-files-found: warn

  benchmarks-build:
    name: Benchmarks Build
    runs-on: ubuntu-latest
    # Keep a build-only check on pushes, including every feature-gated bench.
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable

      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ runner.temp }}/bsv-rs-bench-build
          key: ${{ runner.os }}-bench-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-bench-

      - name: Build benchmarks
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/bsv-rs-bench-build
        run: |
          cargo generate-lockfile
          cargo bench --no-run --all-features --locked

  # Add each new producer job to needs when it lands (#77, #78, #80).
  # Missing producers are reported by name; this job never invents measurements.
  scoreboard:
    name: scoreboard
    if: ${{ always() }}
    needs: [test, clippy, fmt, vectors, docs, actionlint, secrets, msrv, machete, benchmarks, benchmarks-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Download available scoreboard inputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: ${{ runner.temp }}/scoreboard-inputs
          pattern: '{*bench*,*ratchet*,*wasm*,*mutant*,*mutation*}'

      - name: scoreboard
        env:
          SCOREBOARD_REPOSITORY: ${{ github.repository }}
          SCOREBOARD_COMMIT: ${{ github.sha }}
          SCOREBOARD_RUN: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          repository = os.environ["SCOREBOARD_REPOSITORY"]
          commit = os.environ["SCOREBOARD_COMMIT"]
          run_id = os.environ["SCOREBOARD_RUN"]
          definitions = {
              "benchmarks": ("benchmarks (#77)", ("bench",), ("benches/baseline.json", "baseline.json")),
              "ratchets": ("ratchet (#78)", ("ratchet",), ("docs/ratchets.json", "ratchets.json")),
              "wasm_sizes": ("wasm32 (#80/#96)", ("wasm",), ("wasm-sizes.json",)),
              "mutation": ("mutants (#81; the nightly workflow, not yet in the tree)", ("mutant", "mutation"), ("mutation-summary.json",)),
          }
          report = {
              "repository": repository,
              "commit": commit,
              "run_id": run_id,
              "inputs": {
                  key: {"producer": spec[0], "status": "not yet measured", "records": []}
                  for key, spec in definitions.items()
              },
              "errors": [],
          }

          def reject_constant(value):
              raise ValueError("Non-finite JSON constant: " + value)

          def record(key, raw, source):
              try:
                  data = json.loads(raw, parse_constant=reject_constant)
                  json.dumps(data, allow_nan=False)
              except (ValueError, UnicodeDecodeError):
                  report["errors"].append("Invalid JSON from " + source["file"])
                  return
              report["inputs"][key]["records"].append({
                  "source": source,
                  "sha256": hashlib.sha256(raw).hexdigest(),
                  "data": data,
              })
              report["inputs"][key]["status"] = "available"

          try:
              downloads = Path(os.environ["RUNNER_TEMP"], "scoreboard-inputs")
              for path in sorted(downloads.rglob("*.json")):
                  relative = path.relative_to(downloads)
                  artifact = relative.parts[0]
                  for key, (_, stems, filenames) in definitions.items():
                      if any(stem in artifact.lower() for stem in stems) and any(
                          relative.as_posix().endswith("/" + name) for name in filenames
                      ):
                          record(key, path.read_bytes(), {
                              "kind": "current_run",
                              "commit": commit,
                              "run_id": run_id,
                              "artifact": artifact,
                              "file": relative.as_posix(),
                          })
              for key, filename in (("benchmarks", "benches/baseline.json"), ("ratchets", "docs/ratchets.json")):
                  baseline = Path(filename)
                  if baseline.is_file():
                      record(key, baseline.read_bytes(), {
                          "kind": "repository_baseline",
                          "commit": commit,
                          "file": filename,
                      })
          except OSError as error:
              report["errors"].append(str(error))

          encoded = json.dumps(report, indent=2, sort_keys=True, allow_nan=False) + "\n"
          Path(os.environ["RUNNER_TEMP"], "scoreboard.json").write_text(encoded)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## bsv-rs scoreboard\n\n```json\n" + encoded + "```\n")
          for entry in report["inputs"].values():
              print(f"{entry['producer']}: {entry['status']}")
          if report["errors"]:
              raise SystemExit("scoreboard: collection failed; see the JSON errors")
          PY
