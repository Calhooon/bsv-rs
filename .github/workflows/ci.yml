name: CI

on:
  push:
    branches: [main, beta]
  pull_request:
    branches: [main, beta]
  # sync-main-into-beta.yml starts the suite on its PR's branch: a PR or a push made with the
  # GITHUB_TOKEN starts no workflow, a workflow_dispatch does
  workflow_dispatch:
  # release.yml runs these same jobs on a version tag before it publishes
  workflow_call:
    secrets:
      DEPENDENTS_READ_TOKEN:
        description: Read-only access to the private consumers in docs/dependents.lock
        required: false

permissions:
  contents: read

# The required set, nothing more (the owner's word of 2026-10-26 for a pull request, of
# 2026-10-27 for a push): a pull request runs exactly the required contexts of its base line's
# protection (and the jobs `dependents` needs to decide), one test cell and one wasm32 consumer
# among them; a push to beta or main runs the same set for its line, less the jobs that read a
# pull request (`semver`, `beta-born`). A dispatch (the nightly's on each line, the sync's on its
# branch) and a tag's call from release.yml add the five other test cells and run `dependents` on
# any line. Every job that judges something other than the commit is in a workflow of its own,
# run on dispatch and called by release.yml before a tag: bench.yml (the benchmark regression
# check and the scoreboard), msrv.yml, features.yml (each feature alone, the other five wasm32
# slices), machete.yml, docs.yml (rustdoc and actionlint). Each condition is on the event and
# the refs, so the one file serves both lines; tests/arch_ci_pr_runs_the_required_set.rs pins
# the exact set for every event.
#
# a newer push to the same branch or PR cancels the run it supersedes; a tag's run is never
# cancelled. A cancelled run is superseded, never a red: the newer run judges the same line. The
# group carries the event, so a dispatch (the nightly's, the sync's) is never cancelled by a push
# to the same ref and never cancels one; a pull request's own ref keeps each PR in a group of its own.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  # dependents is required on main alone: a pull request into beta and a push to beta skip the
  # three jobs; a dispatch on any line and a tag's call run them
  dependents-plan:
    name: Plan pinned dependents
    if: >-
      github.base_ref == 'main' ||
      (github.event_name != 'pull_request' && !(github.event_name == 'push' && github.ref == 'refs/heads/beta'))
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Test the dependent selector and resolution guard
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_dependents.py'

      - name: Select the pins that admit this version
        id: plan
        env:
          # a private row is planned only when the read token exists (a fork PR never has it)
          HAS_READ_TOKEN: ${{ secrets.DEPENDENTS_READ_TOKEN != '' }}
        run: python3 -B .github/scripts/dependents.py plan --sdk "$GITHUB_WORKSPACE" --output "$GITHUB_OUTPUT"

  dependent-check:
    name: dependent (${{ matrix.id }})
    needs: dependents-plan
    if: needs.dependents-plan.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.dependents-plan.outputs.matrix) }}
    steps:
      - name: Keep build output in runner scratch
        run: |
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/dependents-target" >> "$GITHUB_ENV"
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"

      # Sibling checkouts keep the downstream and its generated lock outside
      # the SDK tree. Neither checkout retains a credential.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: sdk
          persist-credentials: false

      - name: Require read access for a private consumer
        if: matrix.private
        env:
          READ_TOKEN: ${{ secrets.DEPENDENTS_READ_TOKEN }}
        run: |
          if [ -z "$READ_TOKEN" ]; then
            echo '::error::Private dependents require the DEPENDENTS_READ_TOKEN read-only repository secret; the captain must request access from the owner.'
            exit 1
          fi

      - name: Check out the locked default-branch revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.rev }}
          path: consumer
          token: ${{ matrix.private && secrets.DEPENDENTS_READ_TOKEN || github.token }}
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Check the consumer against the PR tree
        env:
          CONSUMER: ${{ matrix.id }}
        run: python3 -B sdk/.github/scripts/dependents.py run --sdk "$GITHUB_WORKSPACE/sdk" --checkout "$GITHUB_WORKSPACE/consumer" --consumer "$CONSUMER"

  dependents:
    name: dependents
    needs: [dependents-plan, dependent-check]
    if: >-
      always() && (github.base_ref == 'main' ||
      (github.event_name != 'pull_request' && !(github.event_name == 'push' && github.ref == 'refs/heads/beta')))
    runs-on: ubuntu-latest
    steps:
      - name: Require every eligible consumer check
        env:
          PLAN_RESULT: ${{ needs.dependents-plan.result }}
          CHECK_RESULT: ${{ needs.dependent-check.result }}
          CONSUMER_COUNT: ${{ needs.dependents-plan.outputs.count }}
        run: |
          if [ "$PLAN_RESULT" != success ]; then
            echo '::error::The dependents plan failed or was cancelled.'
            exit 1
          fi
          if [ "$CONSUMER_COUNT" != 0 ] && [ "$CHECK_RESULT" != success ]; then
            echo '::error::An eligible dependent failed or was cancelled; see the named consumer check.'
            exit 1
          fi
          echo "All $CONSUMER_COUNT eligible consumer checks passed."

  # On main a PR checks against the last release tag reachable from its base, and a release tag
  # (release.yml's call) against the release before it, never against itself (#214).
  semver:
    name: semver
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Keep build output in runner scratch
        run: |
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/semver-target" >> "$GITHUB_ENV"
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install the Rust version supported by the pinned semver tool
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: 1.95.0

      - name: Cache the pinned semver tool
        id: semver-tool
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/tools
          key: semver-checks-0.51.0-rust-1.95.0-${{ runner.os }}-${{ runner.arch }}

      - name: Install cargo-semver-checks 0.51.0
        if: steps.semver-tool.outputs.cache-hit != 'true'
        env:
          RUSTFLAGS: ""
        run: cargo install cargo-semver-checks --version 0.51.0 --locked --root "$RUNNER_TEMP/tools"

      - name: Check against the last release tag
        env:
          BASE_REV: ${{ github.event.pull_request.base.sha }}
        run: |
          # A beta prerelease tag (vX.Y.Z-beta.N) is never main's baseline.
          if [ -n "$BASE_REV" ]; then
            baseline="$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude 'v*-*' "$BASE_REV")"
            echo "Checking the PR against $baseline (base $BASE_REV)"
          else
            baseline="$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude 'v*-*' --exclude "$GITHUB_REF_NAME" "$GITHUB_SHA")"
            echo "Checking tag $GITHUB_REF_NAME against $baseline"
          fi
          git clone --quiet --shared "$GITHUB_WORKSPACE" "$RUNNER_TEMP/semver-source"
          cd "$RUNNER_TEMP/semver-source" || exit 1
          # The tool reads a 0.x patch (0.8.3 to 0.8.4) and an unchanged version as minor, which
          # lets a minor-level change through. Main's line ships patches, so a version whose
          # major.minor equals the baseline's is held to patch; any other move is inferred
          # by the tool from the version (a 0.x minor bump is semver's major).
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "bsv-rs") | .version')"
          release_type=()
          if [ "$(echo "$version" | cut -d. -f1,2)" = "$(echo "${baseline#v}" | cut -d. -f1,2)" ]; then
            release_type=(--release-type patch)
          fi
          echo "Cargo.toml $version, baseline $baseline: ${release_type[*]:-release type inferred from the version}"
          "$RUNNER_TEMP/tools/bin/cargo-semver-checks" check-release --baseline-rev "$baseline" --all-features "${release_type[@]}"

  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # a pull request and a push to a line run the required cell alone, Test Suite
      # (ubuntu-latest, stable); a dispatch and a tag's call (whose event is the tag's push) the
      # six. GitHub names a cell by its values in the keys' order, so no name moves
      matrix:
        os: ${{ fromJSON((github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) && '["ubuntu-latest", "macos-latest", "windows-latest"]' || '["ubuntu-latest"]') }}
        rust: ${{ fromJSON((github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) && '["stable", "beta"]' || '["stable"]') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: ${{ matrix.rust }}

      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.rust }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.rust }}-

      - name: Run unit tests
        run: cargo test --lib --all-features --verbose

      # Every integration binary, on the feature set the lanes' gates and
      # CLAUDE.md's numbers use (dhat-profiling stays out: its global
      # allocator is why memory_profiling runs alone below). An enumerated
      # list of binaries drifted to 34 of 73 files (#146).
      - name: Run every integration test
        run: cargo test --features "full,http,websocket" --tests --no-fail-fast --verbose

      - name: Run the memory profiling tests
        run: cargo test --test memory_profiling --all-features --verbose -- --test-threads=1

      - name: Run doc tests
        run: cargo test --doc --all-features

  fixtures:
    name: fixtures
    runs-on: ubuntu-latest
    env:
      BSV_FIXTURES_RECORD: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # The recordings (#76) are beta's: until a cherry-pick brings them to main, say so and stop.
      - name: Skip loudly without the recordings
        id: recordings
        run: |
          if [ -f tests/fixtures_replay.rs ] && [ -d tests/fixtures ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::fixtures skipped: tests/fixtures/ and tests/fixtures_replay.rs are not on this branch (beta's #76); nothing was replayed"
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust
        if: steps.recordings.outputs.present == 'true'
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable

      - name: Keep build output outside the checkout
        if: steps.recordings.outputs.present == 'true'
        run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/bsv-fixtures-target" >> "$GITHUB_ENV"

      - name: Cache cargo registry and fixture build
        if: steps.recordings.outputs.present == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ runner.temp }}/bsv-fixtures-target
          key: ubuntu-fixtures-${{ hashFiles('**/Cargo.lock', 'Cargo.toml') }}

      # This library does not currently commit Cargo.lock. If a later lane
      # supplies it, use that lock unchanged; otherwise lock this job's resolve.
      - name: Resolve dependencies when no lock is committed
        if: steps.recordings.outputs.present == 'true'
        run: test -f Cargo.lock || cargo generate-lockfile

      - name: Replay the public surface fixtures
        if: steps.recordings.outputs.present == 'true'
        run: cargo test --features "full,http" --test fixtures_replay --locked

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
          components: clippy

      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ubuntu-clippy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ubuntu-clippy-

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      # Each published slice alone (#115): a function dead under one slice fails every consumer
      # that builds that slice with warnings denied, and --all-features never sees it.
      - name: Clippy on each slice alone
        run: |
          for slice in primitives block compat totp script transaction wallet \
                       "auth,wallet,transaction,overlay,socketio,wasm" "wallet,auth,transaction,wasm" \
                       "transaction,wasm" "overlay,wasm" "auth,socketio,wasm"; do
            echo "::group::$slice"
            cargo clippy --no-default-features --features "$slice" -- -D warnings
            echo "::endgroup::"
          done

  ratchet:
    name: ratchet
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Keep generated files outside the checkout
        run: |
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/bsv-rs-ratchet-target" >> "$GITHUB_ENV"
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/bsv-rs-ratchet-target"

      # Diagnostics are compiler-version dependent; keep the baseline's toolchain.
      - name: Install the measurement toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: "1.95.0"
          components: clippy, rustfmt

      - name: Cache the measurement build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.CARGO_TARGET_DIR }}
          key: ${{ runner.os }}-ratchet-1.95.0-${{ hashFiles('tools/ratchet/Cargo.lock', 'tools/ratchet/library.Cargo.lock') }}

      - name: Check the measurement tool
        run: |
          cargo +1.95.0 fmt --manifest-path tools/ratchet/Cargo.toml -- --check
          cargo +1.95.0 clippy --locked --manifest-path tools/ratchet/Cargo.toml --all-targets -- -D warnings
          cargo +1.95.0 test --locked --manifest-path tools/ratchet/Cargo.toml

      - name: Reject code-health increases
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_REF" ] && [ "$BASE_REF" != 0000000000000000000000000000000000000000 ]; then
            tools/ratchet/run --check --against "$BASE_REF"
          else
            tools/ratchet/run --check
          fi

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  # the conformance vectors as one named check (a required status on main): the shared JSON under
  # tests/vectors/ and the ts-stack corpus. The conformance files skip when the corpus is absent
  # (Calhooon/bsv-rs#31), so the corpus is checked out at the commit the pinned totals were audited
  # against (5,116 evaluation vectors) and its presence is asserted before the tests run
  vectors:
    name: vectors
    runs-on: ubuntu-latest
    env:
      BSV_CONFORMANCE_DIR: ${{ github.workspace }}/ts-stack/conformance
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check out the ts-stack conformance corpus
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: bsv-blockchain/ts-stack
          ref: edf6e03dad39bd7bc4fc6e73e64de3a2b6f805c9
          path: ts-stack
          sparse-checkout: conformance
          persist-credentials: false

      - name: Assert the corpus is present
        run: test -f "$BSV_CONFORMANCE_DIR/META.json"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable

      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ubuntu-vectors-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ubuntu-vectors-

      - name: Run the chain primitive vectors
        run: cargo test --all-features --test chain_primitives --test chain_difficulty --test chain_encoding --test canonical_varint --test hash_stream --test hkdf_wycheproof --verbose

      - name: Run the vector-backed tests
        run: cargo test --all-features --test conformance_beef --test conformance_scripts --test script_vectors_tests --test broadcaster_http_tests --test wallet_http_json_busy_tests --verbose -- --nocapture

  # the secrets scan (bsv-stack-lean #140): gitleaks over the commits the event brings, the
  # values redacted, the locations printed; the findings judged not secrets are named by
  # fingerprint in .gitleaksignore or, for test material that is not a secret, by reason in
  # .gitleaks.toml. On a pull request the scan covers the PR's own commits (what decides the
  # merge; gitleaks's default is every ref of the checkout, so a literal on any pushed branch
  # failed every PR, bsv-rs#272); on a push and on a dispatch the line's full history.
  # gitleaks is built from its release source, the tarball pinned by sha256 (no third-party action)
  secrets:
    name: secrets
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: e90fb266d75837e75894c778bf594ab8e2787f12dce5a62651f21b893eaf9abb
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build gitleaks from its pinned source
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" "https://github.com/gitleaks/gitleaks/archive/refs/tags/v${GITLEAKS_VERSION}.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/gitleaks-${GITLEAKS_VERSION}"
          go build -o "$RUNNER_TEMP/bin/gitleaks" .

      - name: Scan the commits the event brings
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ] && [ -n "${PR_BASE_SHA}" ]; then
            log_opts="${PR_BASE_SHA}..HEAD"
          else
            log_opts="HEAD"
          fi
          "$RUNNER_TEMP/bin/gitleaks" git --redact --no-banner --exit-code 1 -v --log-opts="${log_opts}" .

  # nothing sits on main that beta lacks (RELEASING.md, "The direction rule"): every commit of
  # origin/main is on the tree (the PR's merge commit, beta's tip after a push, the sync branch on
  # a dispatch) by sha, by patch (git cherry), or by a cherry-pick link in either direction: main's
  # commit names a beta source on the tree, or a commit of the tree names main's. Main's commits
  # come back by sync-main-into-beta.yml's cherry-pick -x, landed by rebase merge (linear history)
  main-in-beta:
    name: main-in-beta
    if: >-
      (github.event_name == 'pull_request' && github.base_ref == 'beta') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/beta') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/sync/main-into-beta')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # the cold review's guard (PR #205); the logs are read into a variable, never piped into
      # grep -q: under pipefail a grep that stops early fails its writer with SIGPIPE (141)
      - name: Every commit of origin/main is on HEAD by sha, patch or cherry-pick link
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          base="$(git merge-base origin/main HEAD)"
          linked="$(git log --format=%B "$base..HEAD")"
          missing=()
          while read -r mark sha _; do
            [ "$mark" = "+" ] || continue                       # "-": a patch-equivalent commit is on HEAD
            src="$(git log -1 --format=%B "$sha" | sed -n 's/.*(cherry picked from commit \([0-9a-f]\{40\}\)).*/\1/p')"
            src="${src%%$'\n'*}"
            if [ -n "$src" ] && git merge-base --is-ancestor "$src" HEAD; then continue; fi   # main's commit names its beta source
            if grep -qF "(cherry picked from commit ${sha})" <<< "$linked"; then continue; fi   # a beta commit names it
            missing+=("$sha")
          done < <(git cherry HEAD origin/main)
          if [ "${#missing[@]}" -eq 0 ]; then
            echo "every commit of origin/main $(git rev-parse --short origin/main) is on $(git rev-parse --short HEAD) by sha, patch or cherry-pick link"
            exit 0
          fi
          echo "The commits main has that this tree lacks (no patch-equivalent, no cherry-pick link):"
          for sha in "${missing[@]}"; do git log -1 --oneline "$sha"; done
          echo "::error::main has ${#missing[@]} commit(s) beta lacks; cherry-pick each onto beta with -x through a PR (sync-main-into-beta.yml opens it from sync/main-into-beta) before this lands"
          exit 1

  # every fix is born on beta (RELEASING.md, "The direction rule"): each commit of a PR into main
  # is on origin/beta by sha, by patch, or by a cherry-pick link in either direction. A release
  # commit (Cargo.toml's version and CHANGELOG.md's headings, nothing else) is main-born by nature
  # and passes, said in the log
  beta-born:
    name: beta-born
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Every commit of the PR is on origin/beta by sha, patch or cherry-pick link
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin beta
          # a release commit: Cargo.toml and CHANGELOG.md alone, every changed line a package
          # version or a changelog heading, and a version among them
          release_commit() {
            local files changed
            files="$(git diff-tree --no-commit-id --name-only -r "$1")"
            [ -n "$files" ] || return 1
            while IFS= read -r file; do
              case "$file" in Cargo.toml | CHANGELOG.md) ;; *) return 1 ;; esac
            done <<< "$files"
            changed="$(git diff -U0 "$1^" "$1" | grep -E '^[-+]' | grep -vE '^(\+\+\+|---) ' || true)"
            grep -qE '^\+version = "' <<< "$changed" || return 1
            ! grep -qvE '^[-+](version = "[^"]*"|## \[(Unreleased|[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?)\]( - [0-9]{4}-[0-9]{2}-[0-9]{2})?)?$' <<< "$changed"
          }
          base="$(git merge-base "$PR_BASE" "$PR_HEAD")"
          linked="$(git log --format=%B "$(git merge-base origin/beta "$PR_HEAD")..origin/beta")"
          missing=()
          while read -r mark sha _; do
            [ "$mark" = "+" ] || continue                       # "-": a patch-equivalent commit is on beta
            src="$(git log -1 --format=%B "$sha" | sed -n 's/.*(cherry picked from commit \([0-9a-f]\{40\}\)).*/\1/p')"
            src="${src%%$'\n'*}"
            if [ -n "$src" ] && git merge-base --is-ancestor "$src" origin/beta; then continue; fi   # the PR's commit names its beta source
            if grep -qF "(cherry picked from commit ${sha})" <<< "$linked"; then continue; fi   # a beta commit names it
            if release_commit "$sha"; then
              echo "a release commit, main-born by nature (Cargo.toml's version and CHANGELOG.md's headings alone): $(git log -1 --oneline "$sha")"
              continue
            fi
            missing+=("$sha")
          done < <(git cherry origin/beta "$PR_HEAD" "$base")
          if [ "${#missing[@]}" -eq 0 ]; then
            echo "every commit of the PR ($(git rev-parse --short "$base")..$(git rev-parse --short "$PR_HEAD")) is on origin/beta $(git rev-parse --short origin/beta) by sha, patch or cherry-pick link, or a release commit"
            exit 0
          fi
          echo "The commits of this PR beta lacks (no patch-equivalent, no cherry-pick link, not a release commit):"
          for sha in "${missing[@]}"; do git log -1 --oneline "$sha"; done
          echo "::error::${#missing[@]} commit(s) of this PR were not born on beta; land each on beta through a PR, then cherry-pick it here with -x"
          exit 1

  # The combined library slice the Workers consume (the required wasm32 (combined), the slice
  # CLAUDE.md rule 6 names), on every event; the other five slices are features.yml's. The
  # one-cell matrix keeps the context's name. Keep dead code in a diagnostic cdylib so the size
  # is not an empty module; #96 will define the deployment artifact and its size budget.
  wasm32:
    name: wasm32 (${{ matrix.consumer }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        consumer: [combined]
    env:
      SLICE_NAME: ${{ matrix.consumer }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Select the consumer's features
        run: |
          case "$SLICE_NAME" in
            combined) features=auth,wallet,transaction,overlay,socketio,wasm ;;
            *) echo "::error::no feature slice for consumer $SLICE_NAME"; exit 1 ;;
          esac
          echo "SLICE_FEATURES=$features" >> "$GITHUB_ENV"

      - name: Put build output in runner scratch
        run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/bsv-rs-wasm32" >> "$GITHUB_ENV"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Build the library slice
        run: cargo build --lib --target wasm32-unknown-unknown --no-default-features --features "$SLICE_FEATURES"

      - name: Measure the diagnostic wasm artifact
        run: |
          cargo rustc --lib --crate-type cdylib --target wasm32-unknown-unknown --no-default-features --features "$SLICE_FEATURES" -- -C link-dead-code=yes
          artifact="$CARGO_TARGET_DIR/wasm32-unknown-unknown/debug/bsv_rs.wasm"
          bytes=$(wc -c < "$artifact")
          printf '%s: %s bytes (debug cdylib, dead code retained)\n' "$SLICE_NAME" "$bytes"

  deny:
    name: deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Install cargo-deny 0.20.2
        env:
          RUSTFLAGS: ""
          CARGO_TARGET_DIR: ${{ runner.temp }}/cargo-deny-target
        run: cargo install cargo-deny --version 0.20.2 --locked --root "$RUNNER_TEMP/tools"

      # This library does not commit Cargo.lock. Resolve once, then keep that
      # same lockfile for all three graphs; every check must succeed.
      - name: Resolve the audit lockfile
        run: cargo generate-lockfile

      - name: Check all features, the Cloudflare slice and default features
        run: |
          result=0
          "$RUNNER_TEMP/tools/bin/cargo-deny" --locked --all-features check || result=1
          "$RUNNER_TEMP/tools/bin/cargo-deny" --locked --no-default-features --features "auth,wallet,transaction,overlay,socketio,wasm" --target wasm32-unknown-unknown check || result=1
          "$RUNNER_TEMP/tools/bin/cargo-deny" --locked check || result=1
          exit "$result"
