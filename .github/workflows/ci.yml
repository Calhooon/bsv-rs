name: CI

on:
  push:
    branches: [main, beta]
  pull_request:
    branches: [main, beta]
  # sync-main-into-beta.yml starts the suite on its PR's branch: a PR or a push made with the
  # GITHUB_TOKEN starts no workflow, a workflow_dispatch does
  workflow_dispatch:
  # release.yml runs these same jobs on a version tag before it publishes
  workflow_call:
    secrets:
      DEPENDENTS_READ_TOKEN:
        description: Read-only access to the private consumers in docs/dependents.lock
        required: false

permissions:
  contents: read

# The required set, nothing more (the owner's word of 2026-10-26 for a pull request, of
# 2026-10-27 for a push): a pull request runs exactly the required contexts of its base line's
# protection (and the jobs `dependents` needs to decide), one test cell, `lint` and `checks`
# among them; a push to beta or main runs the same set for its line, less the jobs that read a
# pull request (`semver`, `beta-born`). A dispatch (the nightly's on each line, the sync's on its
# branch) and a tag's call from release.yml add the five other test cells and run `dependents` on
# any line. Every job that judges something other than the commit is in a workflow of its own,
# run on dispatch and called by release.yml before a tag: bench.yml (benchmark builds and the
# scoreboard; comparisons only on a branch), msrv.yml, features.yml (each feature alone, the
# other five wasm32 slices), machete.yml, docs.yml (actionlint). Documentation judges the commit
# and joins the required set on both lines (#515, the keeper's word of 2026-10-30), a step of
# `checks` since the small gates were bundled (docs/lanes/ci-speed-2.md).
# Each condition is on the event and the refs, so the one file serves both lines;
# tests/arch_ci_pr_runs_the_required_set.rs pins
# the exact set for every event.
#
# a newer push to the same branch or PR cancels the run it supersedes; a tag's run is never
# cancelled. A cancelled run is superseded, never a red: the newer run judges the same line. The
# group carries the event, so a dispatch (the nightly's, the sync's) is never cancelled by a push
# to the same ref and never cancels one; a pull request's own ref keeps each PR in a group of its own.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  # dependents is required on main alone: a pull request into beta and a push to beta skip the
  # three jobs; a dispatch on any line and a tag's call run them
  dependents-plan:
    name: Plan pinned dependents
    if: >-
      github.base_ref == 'main' ||
      (github.event_name != 'pull_request' && !(github.event_name == 'push' && github.ref == 'refs/heads/beta'))
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Test the dependent selector and resolution guard
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_dependents.py'

      - name: Select the pins that admit this version
        id: plan
        env:
          # a private row is planned only when the read token exists (a fork PR never has it)
          HAS_READ_TOKEN: ${{ secrets.DEPENDENTS_READ_TOKEN != '' }}
        run: python3 -B .github/scripts/dependents.py plan --sdk "$GITHUB_WORKSPACE" --output "$GITHUB_OUTPUT"

  dependent-check:
    name: dependent (${{ matrix.id }})
    needs: dependents-plan
    if: needs.dependents-plan.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # The fleet's runner cap (#682's second fold, the keeper's word (a) of 2026-11-03; six since
      # the keeper's line of 10:0xZ 2026-11-03, the pool's non-heavy p95 being 14 of the twenty):
      # a literal; the seven consumers run six, then one, wherever the matrix runs (a dispatch, a
      # tag, a push to main, a pull request into main), the seventh, bsv-middleware-cloudflare
      # (1m37s), after the earliest finish, inside the toolbox's 7m08s in run 41579745459;
      # tests/arch_nightly_cap.rs refuses it removed or above 6.
      max-parallel: 6
      matrix: ${{ fromJSON(needs.dependents-plan.outputs.matrix) }}
    steps:
      - name: Keep build output in runner scratch
        run: |
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/dependents-target" >> "$GITHUB_ENV"
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"

      # Sibling checkouts keep the downstream and its generated lock outside
      # the SDK tree. Neither checkout retains a credential.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: sdk
          persist-credentials: false

      - name: Require read access for a private consumer
        if: matrix.private
        env:
          READ_TOKEN: ${{ secrets.DEPENDENTS_READ_TOKEN }}
        run: |
          if [ -z "$READ_TOKEN" ]; then
            echo '::error::Private dependents require the DEPENDENTS_READ_TOKEN read-only repository secret; the captain must request access from the owner.'
            exit 1
          fi

      - name: Check out the locked default-branch revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.rev }}
          path: consumer
          token: ${{ matrix.private && secrets.DEPENDENTS_READ_TOKEN || github.token }}
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Check the consumer against the PR tree
        env:
          CONSUMER: ${{ matrix.id }}
        run: python3 -B sdk/.github/scripts/dependents.py run --sdk "$GITHUB_WORKSPACE/sdk" --checkout "$GITHUB_WORKSPACE/consumer" --consumer "$CONSUMER"

  dependents:
    name: dependents
    needs: [dependents-plan, dependent-check]
    if: >-
      always() && (github.base_ref == 'main' ||
      (github.event_name != 'pull_request' && !(github.event_name == 'push' && github.ref == 'refs/heads/beta')))
    runs-on: ubuntu-latest
    steps:
      - name: Require every eligible consumer check
        env:
          PLAN_RESULT: ${{ needs.dependents-plan.result }}
          CHECK_RESULT: ${{ needs.dependent-check.result }}
          CONSUMER_COUNT: ${{ needs.dependents-plan.outputs.count }}
        run: |
          if [ "$PLAN_RESULT" != success ]; then
            echo '::error::The dependents plan failed or was cancelled.'
            exit 1
          fi
          if [ "$CONSUMER_COUNT" != 0 ] && [ "$CHECK_RESULT" != success ]; then
            echo '::error::An eligible dependent failed or was cancelled; see the named consumer check.'
            exit 1
          fi
          echo "All $CONSUMER_COUNT eligible consumer checks passed."

  semver:
    name: semver
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Keep build output in runner scratch
        run: |
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/semver-target" >> "$GITHUB_ENV"
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install the Rust version supported by the pinned semver tool
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: 1.95.0

      - name: Cache the pinned semver tool
        id: semver-tool
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/tools
          key: semver-checks-0.51.0-rust-1.95.0-${{ runner.os }}-${{ runner.arch }}

      - name: Install cargo-semver-checks 0.51.0
        if: steps.semver-tool.outputs.cache-hit != 'true'
        env:
          RUSTFLAGS: ""
        run: cargo install cargo-semver-checks --version 0.51.0 --locked --root "$RUNNER_TEMP/tools"

      - name: Check against the last tag reachable from the PR base
        env:
          BASE_REV: ${{ github.event.pull_request.base.sha }}
        run: |
          baseline="$(git describe --tags --abbrev=0 --match 'v[0-9]*' "$BASE_REV")"
          echo "Checking the PR against $baseline (base $BASE_REV)"
          git clone --quiet --shared "$GITHUB_WORKSPACE" "$RUNNER_TEMP/semver-source"
          cd "$RUNNER_TEMP/semver-source"
          # A 0.x minor or a beta suffix must not waive breaking API changes.
          # The release type is inferred from the version change between the baseline tag and
          # Cargo.toml (a 0.x minor bump is semver's major): a breaking change passes only when the
          # version says so, an additive one only when it says at least minor (#87's 0.9.0).
          "$RUNNER_TEMP/tools/bin/cargo-semver-checks" check-release --baseline-rev "$baseline" --all-features

  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    # pull-requests: read for the label read below (cut 4, docs/lanes/ci-speed-4.md); release.yml's
    # call grants the same, a nested job asking more than its caller grants never starts
    permissions:
      contents: read
      pull-requests: read
    # Speed round 1, cut 1 (docs/lanes/ci-speed-1.md): no debuginfo and no incremental state in
    # the job's builds (env, so a developer's `cargo test` keeps both); a panic keeps its
    # file:line (std::panic::Location is data, not debuginfo), a backtrace's frames lose theirs.
    # The linker is rustc's own rust-lld, the default on x86_64-unknown-linux-gnu since 1.90.
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    strategy:
      fail-fast: false
      # The fleet's runner cap on a dispatch (#682's second fold; six since the keeper's line of
      # 10:0xZ 2026-11-03): a literal, the six cells at it (tests/arch_nightly_cap.rs)
      max-parallel: 6
      # a pull request and a push to a line run the required cell alone, Test Suite
      # (ubuntu-latest, stable); a dispatch and a tag's call (whose event is the tag's push) the
      # six. GitHub names a cell by its values in the keys' order, so no name moves
      matrix:
        os: ${{ fromJSON((github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) && '["ubuntu-latest", "macos-latest", "windows-latest"]' || '["ubuntu-latest"]') }}
        rust: ${{ fromJSON((github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) && '["stable", "beta"]' || '["stable"]') }}
    steps:
      # two commits deep: a pull request's merge ref and HEAD^1, the base it is tested on
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2

      # Speed round 1, cut 4 (#667, docs/lanes/ci-speed-4.md): a pull request runs the test
      # targets its changed files reach (`.github/scripts/affected_tests.py`, the #666 reach
      # rule read the other way); the whole suite on a push to a line, a dispatch and a tag's
      # call, when the plan says everything (the manifest, the crate root, this workflow, the
      # plan's script), and once per landing: the sequencer labels the PR `full-suite` before it
      # pushes the rebased head, and the label is read live here, never by a `labeled` trigger
      # (a second run per label, the toolbox's twin runs). The plan's own tests run before it.
      # Speed round 2 (#668, docs/lanes/ci-speed-loop2-docs-only.md): a plan that reaches
      # nothing (no unit, doc or integration target: `build` false) restores no cache, installs
      # nothing and builds nothing; every step after this one carries `build` or a flag that
      # implies it (each condition one of the exact forms tests/arch_ci_docs_only_exit.rs
      # names; only the checkout runs before this step), and the last step reports the job
      # green. The keys this step writes are tied to the ones read below
      # (test_affected_tests.py, the #688 fold).
      - name: Plan the targets the change reaches
        id: plan
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != pull_request ]; then
            echo "a $EVENT run: the whole suite"
            printf '%s\n' whole=true build=true lib=true doc=true memory=true tracing=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 -B -m unittest discover -s .github/scripts -p 'test_affected_tests.py'
          plan="$RUNNER_TEMP/affected.json"
          echo "file=$plan" >> "$GITHUB_OUTPUT"
          # read live at the job's start; a failed read fails the job, never a narrower run
          labels=$(gh api "repos/$REPOSITORY/pulls/$PR" --jq '[.labels[].name] | join(",")')
          echo "labels: ${labels:-none}"
          if [[ ",$labels," == *",full-suite,"* ]]; then
            python3 -B .github/scripts/affected_tests.py plan --whole "the full-suite label: the landing run" --output "$plan"
          else
            python3 -B .github/scripts/affected_tests.py plan --range HEAD^1..HEAD --output "$plan"
          fi

      - name: Install Rust
        if: steps.plan.outputs.build == 'true'
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: ${{ matrix.rust }}

      # This library tracks no Cargo.lock, so the job resolves one before the cache step and the
      # action hashes it: without it the key would hold Cargo.toml alone, and a dependency's
      # compatible release would be rebuilt on every exact hit (which saves nothing) until
      # Cargo.toml changed. With it a compatible release moves the key: one miss, a restore by
      # the restore key, a rebuild of the changed dependencies and a save under the new key.
      - name: Resolve dependencies when no lock is committed
        if: steps.plan.outputs.build == 'true'
        run: test -f Cargo.lock || cargo generate-lockfile

      # The dependencies' build, keyed by the runner's OS, rustc's version, host and commit hash,
      # the CARGO*/RUST* environment (RUSTFLAGS and the profile above), Cargo.toml and the
      # lockfile generated in the step above (no lockfile is tracked); the workspace crate is
      # rebuilt every run. One shared key for the job's feature sets. A pull request restores
      # its base line's cache by the action's restore keys and saves one of its own only on a
      # miss; a dispatch or a tag's call restores and never saves (the repository's 10 GB budget
      # stays with the required cell). A pull request saves only when its plan is the whole
      # suite (cut 4; the #680 fold): a plan that builds no library, or a subset that leaves the
      # memory, tracing or integration build unrun, would save a partial target under the shared
      # key, every later run's exact hit; the landing run carries `full-suite`, so a complete
      # cache is still saved once per landing.
      - name: Cache the dependencies' build
        if: steps.plan.outputs.build == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v1-rust
          shared-key: test-suite
          cache-bin: "false"
          cache-on-failure: "true"
          save-if: ${{ (github.event_name == 'pull_request' && steps.plan.outputs.whole == 'true') || (github.event_name == 'push' && (github.ref == 'refs/heads/beta' || github.ref == 'refs/heads/main')) }}

      - name: Install cargo-nextest
        if: steps.plan.outputs.build == 'true'
        uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          tool: nextest@0.9.150

      # The reached set beside the whole: `cargo metadata` lists every integration target
      # without building one (`cargo nextest list` would build all of them, the cost the
      # reached run saves); every reached name is a target, and a library change reaches some.
      - name: Check the reached set within the whole
        if: github.event_name == 'pull_request' && steps.plan.outputs.build == 'true'
        shell: bash
        run: |
          cargo metadata --no-deps --format-version 1 > "$RUNNER_TEMP/metadata.json"
          python3 -B .github/scripts/affected_tests.py check --plan "${{ steps.plan.outputs.file }}" --metadata "$RUNNER_TEMP/metadata.json"

      - name: Run unit tests
        if: steps.plan.outputs.lib == 'true'
        run: cargo nextest run --lib --all-features --no-fail-fast --cargo-verbose

      # Every integration binary, on the feature set the lanes' gates and
      # CLAUDE.md's numbers use (dhat-profiling stays out: its global
      # allocator is why memory_profiling runs alone below). An enumerated
      # list of binaries drifted to 34 of 73 files (#146). nextest runs the
      # binaries' tests side by side, each test in a process of its own.
      - name: Run every integration test
        if: steps.plan.outputs.whole == 'true'
        run: cargo nextest run --features "full,http,websocket" --tests --no-fail-fast --cargo-verbose

      # The plan's binaries as `--test` names: cargo builds those alone (an `-E 'binary(..)'`
      # filter after `--tests` would build every binary and run some); nextest keeps
      # `--no-fail-fast` and each test's timing either way.
      - name: Run the integration tests the change reaches
        if: steps.plan.outputs.whole != 'true' && steps.plan.outputs.reached != '0'
        env:
          REACHED_TESTS: ${{ steps.plan.outputs.tests }}
        run: |
          # shellcheck disable=SC2086 # the `--test <name>` words split on purpose
          cargo nextest run --features "full,http,websocket" $REACHED_TESTS --no-fail-fast --cargo-verbose

      # nextest runs each test in a process of its own, so each has dhat's
      # global allocator and its one profiler to itself: the isolation
      # `--test-threads=1` gave, without running the thirteen one at a time.
      # RUST_TEST_THREADS reaches libtest inside each process, not nextest's
      # own count: with one thread libtest runs the test on its synchronous
      # path, without the 60-second warning that allocates in the profile
      # (#372; nextest passes `--exact <name>` and no thread count).
      - name: Run the memory profiling tests
        if: steps.plan.outputs.memory == 'true'
        env:
          RUST_TEST_THREADS: "1"
        run: cargo nextest run --test memory_profiling --all-features --no-fail-fast --cargo-verbose

      # The `tracing` sink (#212) is outside `full`: its event, and the wire's
      # frames with the feature on, the same bytes as without it.
      - name: Run the tracing sink tests
        if: steps.plan.outputs.tracing == 'true'
        run: cargo nextest run --features "full,http,tracing" --test wire_tracing_sink --test wire_error_frames --test fixtures_replay --no-fail-fast --cargo-verbose

      # nextest runs no doc tests
      - name: Run doc tests
        if: steps.plan.outputs.doc == 'true'
        run: cargo test --doc --all-features

      # #668: the plan reached nothing; the required context reports green
      - name: Nothing to build
        if: steps.plan.outputs.build != 'true'
        run: |
          echo "docs-only: nothing to build (the plan reaches no unit, doc or integration target)"

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # Speed round 2 (#668, docs/lanes/ci-speed-loop2-docs-only.md): a docs-only pull request
      # (every changed path a *.md other than README.md, which the ratchet measures, and
      # outside tools/ratchet/, the ratchet's own code; a file under docs/ that is not Markdown
      # is never docs only: docs/ratchets.json is the ratchet's record, the #688 fold; no unit
      # or doc test; none of the binaries this workflow runs by `--test` reached) installs and
      # builds nothing here: every step after the plan carries `docs_only` or waits on `ready`,
      # which carries it; `secrets` still scans its commits. Only a checkout runs before the
      # plan, and every condition is one of the exact forms tests/arch_ci_docs_only_exit.rs
      # names; the keys the plan writes are tied to the ones read here (test_affected_tests.py).
      - name: Plan whether the change is docs only
        id: plan
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != pull_request ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          runs=$(grep -o -- '--test [a-z0-9_]*' .github/workflows/ci.yml | awk '{print $2}' | sort -u | paste -sd, -)
          python3 -B .github/scripts/affected_tests.py plan --range HEAD^1..HEAD --runs "$runs" --output "$RUNNER_TEMP/affected.json"

      # ratchet's diagnostics are compiler-version dependent; it keeps the baseline's toolchain.
      # The stable toolchain is installed after it, so it is the default every other gate runs
      - name: Install the measurement toolchain
        if: steps.plan.outputs.docs_only != 'true'
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: "1.95.0"
          components: clippy, rustfmt

      - name: Install Rust
        if: steps.plan.outputs.docs_only != 'true'
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      # the release binary, checked against the action's manifest, in place of a 2-minute build
      - name: Install cargo-deny 0.20.2
        if: steps.plan.outputs.docs_only != 'true'
        uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          tool: cargo-deny@0.20.2

      # the cache holds Clippy's --all-targets --all-features build (and each slice's), plus
      # ratchet's measurement build outside the checkout
      - name: Cache the Clippy and ratchet builds
        if: steps.plan.outputs.docs_only != 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: lint
          cache-directories: ${{ runner.temp }}/bsv-rs-ratchet-target
          save-if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') }}

      # This library does not commit Cargo.lock. Resolve once, after the cache's key is taken;
      # Clippy builds on it and deny keeps it unchanged (--locked) for all three graphs
      - name: Resolve the lockfile
        id: ready
        if: steps.plan.outputs.docs_only != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/bsv-rs-ratchet-target"
          cargo generate-lockfile

      # The root has no [workspace], so --all stops at the crate: the fuzz
      # crates are checked by manifest path, as the tools are (#180).
      - name: Rustfmt
        id: fmt
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: |
          trap 'if [ $? -eq 0 ]; then echo "PASS Rustfmt"; else echo "FAIL Rustfmt"; fi' EXIT
          cargo fmt --all -- --check
          cargo fmt --manifest-path fuzz/Cargo.toml -- --check
          cargo fmt --manifest-path fuzz/corpus-gen/Cargo.toml -- --check

      # Each published slice alone as well (#115): a function dead under one slice fails every
      # consumer that builds that slice with warnings denied, and --all-features never sees it.
      - name: Clippy
        id: clippy
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: |
          trap 'if [ $? -eq 0 ]; then echo "PASS Clippy"; else echo "FAIL Clippy"; fi' EXIT
          cargo clippy --all-targets --all-features -- -D warnings
          for slice in primitives block compat totp script transaction wallet \
                       "auth,wallet,transaction,overlay,socketio,wasm" "wallet,auth,transaction,wasm" \
                       "transaction,wasm" "overlay,wasm" "auth,socketio,wasm"; do
            echo "::group::$slice"
            cargo clippy --no-default-features --features "$slice" -- -D warnings
            echo "::endgroup::"
          done

      # all features, the Cloudflare slice and default features; every graph must pass
      - name: deny
        id: deny
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: |
          trap 'if [ $? -eq 0 ]; then echo "PASS deny"; else echo "FAIL deny"; fi' EXIT
          result=0
          cargo-deny --locked --all-features check || result=1
          cargo-deny --locked --no-default-features --features "auth,wallet,transaction,overlay,socketio,wasm" --target wasm32-unknown-unknown check || result=1
          cargo-deny --locked check || result=1
          exit "$result"

      - name: ratchet
        id: ratchet
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        env:
          RUSTFLAGS: ""
          CARGO_TARGET_DIR: ${{ runner.temp }}/bsv-rs-ratchet-target
          TMPDIR: ${{ runner.temp }}
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          trap 'if [ $? -eq 0 ]; then echo "PASS ratchet"; else echo "FAIL ratchet"; fi' EXIT
          # the measurement tool itself
          cargo +1.95.0 fmt --manifest-path tools/ratchet/Cargo.toml -- --check
          cargo +1.95.0 clippy --locked --manifest-path tools/ratchet/Cargo.toml --all-targets -- -D warnings
          cargo +1.95.0 test --locked --manifest-path tools/ratchet/Cargo.toml
          # no code-health increase
          if [ -n "$BASE_REF" ] && [ "$BASE_REF" != 0000000000000000000000000000000000000000 ] && git rev-parse --verify --quiet --end-of-options "${BASE_REF}^{commit}" >/dev/null 2>&1; then
            tools/ratchet/run --check --against "$BASE_REF"
          else
            tools/ratchet/run --check
          fi

      - name: Every gate passed
        if: ${{ !cancelled() }}
        env:
          DOCS_ONLY: ${{ steps.plan.outputs.docs_only }}
          VERDICTS: |
            ${{ steps.fmt.outcome }} Rustfmt
            ${{ steps.clippy.outcome }} Clippy
            ${{ steps.deny.outcome }} deny
            ${{ steps.ratchet.outcome }} ratchet
        run: |
          # One line per gate, "<outcome> <gate>", no line skipped: the block's own final
          # newline is cut, so a blank line, an empty outcome or an empty gate name is a FAIL
          # naming its position, never a silent pass.
          failed=()
          pos=0
          while IFS= read -r line; do
            pos=$((pos + 1))
            outcome=${line%% *}
            gate=
            case "$line" in *" "*) gate=${line#* } ;; esac
            if [ -z "$gate" ]; then
              echo "FAIL gate $pos (no gate name; outcome '${outcome}')"
              failed+=("gate $pos (no name)")
            elif [ "$outcome" = success ]; then
              echo "PASS $gate"
            elif [ "$outcome" = skipped ] && [ "$DOCS_ONLY" = true ] && [ "$gate" != secrets ]; then
              echo "SKIP $gate (docs-only: nothing to build, #668)"
            else
              echo "FAIL $gate (gate $pos: ${outcome:-not run})"
              failed+=("$gate")
            fi
          done <<< "${VERDICTS%$'\n'}"
          if [ "${#failed[@]}" -ne 0 ]; then
            echo "::error::lint: ${#failed[@]} gate(s) failed: $(printf '%s, ' "${failed[@]}" | sed 's/, $//')"
            exit 1
          fi

  checks:
    name: checks
    runs-on: ubuntu-latest
    env:
      BSV_CONFORMANCE_DIR: ${{ github.workspace }}/ts-stack/conformance
    steps:
      # the full history: secrets scans the line's history on a push and a dispatch
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # Speed round 2 (#668, docs/lanes/ci-speed-loop2-docs-only.md): a docs-only pull request
      # (every changed path a *.md other than README.md, which the ratchet measures, and
      # outside tools/ratchet/, the ratchet's own code; a file under docs/ that is not Markdown
      # is never docs only: docs/ratchets.json is the ratchet's record, the #688 fold; no unit
      # or doc test; none of the binaries this workflow runs by `--test` reached) installs and
      # builds nothing here: every step after the plan carries `docs_only` or waits on `ready`,
      # which carries it; `secrets` still scans its commits. Only a checkout runs before the
      # plan, and every condition is one of the exact forms tests/arch_ci_docs_only_exit.rs
      # names; the keys the plan writes are tied to the ones read here (test_affected_tests.py).
      - name: Plan whether the change is docs only
        id: plan
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != pull_request ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          runs=$(grep -o -- '--test [a-z0-9_]*' .github/workflows/ci.yml | awk '{print $2}' | sort -u | paste -sd, -)
          python3 -B .github/scripts/affected_tests.py plan --range HEAD^1..HEAD --runs "$runs" --output "$RUNNER_TEMP/affected.json"

      # vectors: the ts-stack corpus at the commit the pinned totals were audited against
      # (5,116 evaluation vectors); the conformance files skip when it is absent
      # (Calhooon/bsv-rs#31), so the vectors gate asserts its presence before the tests run
      - name: Check out the ts-stack conformance corpus
        if: steps.plan.outputs.docs_only != 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: bsv-blockchain/ts-stack
          ref: edf6e03dad39bd7bc4fc6e73e64de3a2b6f805c9
          path: ts-stack
          sparse-checkout: conformance
          persist-credentials: false

      - name: Install Rust
        if: steps.plan.outputs.docs_only != 'true'
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Cache the checks' builds
        if: steps.plan.outputs.docs_only != 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: checks
          save-if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') }}

      # This library does not commit Cargo.lock. If a later lane supplies it, use that lock
      # unchanged; otherwise lock this job's resolve (after the cache's key is taken)
      - name: Resolve dependencies when no lock is committed
        id: ready
        if: steps.plan.outputs.docs_only != 'true'
        run: test -f Cargo.lock || cargo generate-lockfile

      # every .cargo/mutants.toml equivalence entry names exactly one listed mutant (#663): a
      # stale entry excludes nothing and its file reads below its true figure in the nightly.
      # A listing builds nothing (seven files, about six seconds). cargo-mutants is the
      # nightly's version, installed as the nightly installs it (`cargo install --locked`) into
      # the cargo home; the cache above keeps ~/.cargo/bin but saves only on a beta push whose
      # key missed, so the build (about 1m 15s) recurs until the key next moves
      - name: mutants-entries
        id: mutants-entries
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        env:
          CARGO_MUTANTS_VERSION: '27.1.0'
        run: |
          trap 'if [ $? -eq 0 ]; then echo "PASS mutants-entries"; else echo "FAIL mutants-entries"; fi' EXIT
          python3 -B -m unittest discover -s .github/scripts -p 'test_mutants_entries.py'
          cargo install cargo-mutants --version "$CARGO_MUTANTS_VERSION" --locked
          python3 .github/scripts/mutants_entries.py

      # the conformance vectors as one named gate: the shared JSON under tests/vectors/ and the
      # ts-stack corpus
      - name: vectors
        id: vectors
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: |
          trap 'if [ $? -eq 0 ]; then echo "PASS vectors"; else echo "FAIL vectors"; fi' EXIT
          test -f "$BSV_CONFORMANCE_DIR/META.json"
          cargo test --all-features --test chain_primitives --test chain_difficulty --test chain_encoding --test canonical_varint --test hash_stream --test hkdf_wycheproof --verbose
          cargo test --all-features --test conformance_beef --test conformance_scripts --test script_vectors_tests --test broadcaster_http_tests --test wallet_http_json_busy_tests --verbose -- --nocapture

      - name: fixtures
        id: fixtures
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        env:
          BSV_FIXTURES_RECORD: "0"
        run: |
          trap 'if [ $? -eq 0 ]; then echo "PASS fixtures"; else echo "FAIL fixtures"; fi' EXIT
          cargo test --features "full,http" --test fixtures_replay --locked

      # the secrets scan (bsv-stack-lean #140): gitleaks over the commits the event brings, the
      # values redacted, the locations printed; the findings judged not secrets are named by
      # fingerprint in .gitleaksignore or, for test material that is not a secret, by reason in
      # .gitleaks.toml. On a pull request the scan covers the PR's own commits (what decides the
      # merge; gitleaks's default is every ref of the checkout, so a literal on any pushed branch
      # failed every PR, bsv-rs#272); on a push and on a dispatch the line's full history.
      # gitleaks is built from its release source, the tarball pinned by sha256 (no third-party action)
      - name: Scan the commits the event brings
        id: secrets
        if: ${{ !cancelled() && (steps.ready.outcome == 'success' || steps.plan.outputs.docs_only == 'true') }}
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: e90fb266d75837e75894c778bf594ab8e2787f12dce5a62651f21b893eaf9abb
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          trap 'if [ $? -eq 0 ]; then echo "PASS secrets"; else echo "FAIL secrets"; fi' EXIT
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" "https://github.com/gitleaks/gitleaks/archive/refs/tags/v${GITLEAKS_VERSION}.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP"
          (cd "$RUNNER_TEMP/gitleaks-${GITLEAKS_VERSION}" && go build -o "$RUNNER_TEMP/bin/gitleaks" .)
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ] && [ -n "${PR_BASE_SHA}" ]; then
            log_opts="${PR_BASE_SHA}..HEAD"
          else
            log_opts="HEAD"
          fi
          "$RUNNER_TEMP/bin/gitleaks" git --redact --no-banner --exit-code 1 -v --log-opts="${log_opts}" .

      - name: Documentation
        id: docs
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        env:
          RUSTDOCFLAGS: -Dwarnings
        run: |
          trap 'if [ $? -eq 0 ]; then echo "PASS Documentation"; else echo "FAIL Documentation"; fi' EXIT
          cargo doc --no-deps --all-features

      # The combined library slice the Workers consume (the slice CLAUDE.md rule 6 names), on
      # every event; the other five slices are features.yml's. A step, not a matrix: one consumer
      # here. Keep dead code in a diagnostic cdylib so the size is not an empty module; #96 will
      # define the deployment artifact and its size budget. `http` is native-only (#152): the
      # slice with it stops at build.rs, one message
      - name: wasm32 (combined)
        id: wasm32
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        env:
          SLICE_FEATURES: auth,wallet,transaction,overlay,socketio,wasm
        run: |
          trap 'if [ $? -eq 0 ]; then echo "PASS wasm32 (combined)"; else echo "FAIL wasm32 (combined)"; fi' EXIT
          cargo build --lib --target wasm32-unknown-unknown --no-default-features --features "$SLICE_FEATURES"
          if cargo build --lib --target wasm32-unknown-unknown --no-default-features --features "$SLICE_FEATURES,http" 2> "$RUNNER_TEMP/http.log"; then
            echo '::error::the wasm32 build with http succeeded; build.rs no longer refuses it (#152)'
            exit 1
          fi
          grep -F 'feature is native-only and does not build for wasm32' "$RUNNER_TEMP/http.log"
          if grep -E '^error\[E[0-9]+\]|could not compile .bsv-rs. \(lib\)' "$RUNNER_TEMP/http.log"; then
            echo '::error::the wasm32 build with http failed past the build script (#152)'
            exit 1
          fi
          cargo rustc --lib --crate-type cdylib --target wasm32-unknown-unknown --no-default-features --features "$SLICE_FEATURES" -- -C link-dead-code=yes
          bytes=$(wc -c < target/wasm32-unknown-unknown/debug/bsv_rs.wasm)
          printf 'combined: %s bytes (debug cdylib, dead code retained)\n' "$bytes"

      - name: Every gate passed
        if: ${{ !cancelled() }}
        env:
          DOCS_ONLY: ${{ steps.plan.outputs.docs_only }}
          VERDICTS: |
            ${{ steps.mutants-entries.outcome }} mutants-entries
            ${{ steps.vectors.outcome }} vectors
            ${{ steps.fixtures.outcome }} fixtures
            ${{ steps.secrets.outcome }} secrets
            ${{ steps.docs.outcome }} Documentation
            ${{ steps.wasm32.outcome }} wasm32 (combined)
        run: |
          # One line per gate, "<outcome> <gate>", no line skipped: the block's own final
          # newline is cut, so a blank line, an empty outcome or an empty gate name is a FAIL
          # naming its position, never a silent pass.
          failed=()
          pos=0
          while IFS= read -r line; do
            pos=$((pos + 1))
            outcome=${line%% *}
            gate=
            case "$line" in *" "*) gate=${line#* } ;; esac
            if [ -z "$gate" ]; then
              echo "FAIL gate $pos (no gate name; outcome '${outcome}')"
              failed+=("gate $pos (no name)")
            elif [ "$outcome" = success ]; then
              echo "PASS $gate"
            elif [ "$outcome" = skipped ] && [ "$DOCS_ONLY" = true ] && [ "$gate" != secrets ]; then
              echo "SKIP $gate (docs-only: nothing to build, #668)"
            else
              echo "FAIL $gate (gate $pos: ${outcome:-not run})"
              failed+=("$gate")
            fi
          done <<< "${VERDICTS%$'\n'}"
          if [ "${#failed[@]}" -ne 0 ]; then
            echo "::error::checks: ${#failed[@]} gate(s) failed: $(printf '%s, ' "${failed[@]}" | sed 's/, $//')"
            exit 1
          fi

  # nothing sits on main that beta lacks (RELEASING.md, "The direction rule"): every commit of
  # origin/main is on the tree (the PR's merge commit, beta's tip after a push, the sync branch on
  # a dispatch) by sha, by patch (git cherry), or by a cherry-pick link in either direction: main's
  # commit names a beta source on the tree, or a commit of the tree names main's. Main's commits
  # come back by sync-main-into-beta.yml's cherry-pick -x, landed by rebase merge (linear history)
  main-in-beta:
    name: main-in-beta
    if: >-
      (github.event_name == 'pull_request' && github.base_ref == 'beta') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/beta') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/sync/main-into-beta')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # the cold review's guard (PR #205); the logs are read into a variable, never piped into
      # grep -q: under pipefail a grep that stops early fails its writer with SIGPIPE (141)
      - name: Every commit of origin/main is on HEAD by sha, patch or cherry-pick link
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          base="$(git merge-base origin/main HEAD)"
          linked="$(git log --format=%B "$base..HEAD")"
          missing=()
          while read -r mark sha _; do
            [ "$mark" = "+" ] || continue                       # "-": a patch-equivalent commit is on HEAD
            src="$(git log -1 --format=%B "$sha" | sed -n 's/.*(cherry picked from commit \([0-9a-f]\{40\}\)).*/\1/p')"
            src="${src%%$'\n'*}"
            if [ -n "$src" ] && git merge-base --is-ancestor "$src" HEAD; then continue; fi   # main's commit names its beta source
            if grep -qF "(cherry picked from commit ${sha})" <<< "$linked"; then continue; fi   # a beta commit names it
            missing+=("$sha")
          done < <(git cherry HEAD origin/main)
          if [ "${#missing[@]}" -eq 0 ]; then
            echo "every commit of origin/main $(git rev-parse --short origin/main) is on $(git rev-parse --short HEAD) by sha, patch or cherry-pick link"
            exit 0
          fi
          echo "The commits main has that this tree lacks (no patch-equivalent, no cherry-pick link):"
          for sha in "${missing[@]}"; do git log -1 --oneline "$sha"; done
          echo "::error::main has ${#missing[@]} commit(s) beta lacks; cherry-pick each onto beta with -x through a PR (sync-main-into-beta.yml opens it from sync/main-into-beta) before this lands"
          exit 1

  # every fix is born on beta (RELEASING.md, "The direction rule"): each commit of a PR into main
  # is on origin/beta by sha, by patch, or by a cherry-pick link in either direction. A release
  # commit (Cargo.toml's version and CHANGELOG.md's headings, nothing else) is main-born by nature
  # and passes, said in the log
  beta-born:
    name: beta-born
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Every commit of the PR is on origin/beta by sha, patch or cherry-pick link
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin beta
          # a release commit: Cargo.toml and CHANGELOG.md alone, every changed line a package
          # version or a changelog heading, and a version among them
          release_commit() {
            local files changed
            files="$(git diff-tree --no-commit-id --name-only -r "$1")"
            [ -n "$files" ] || return 1
            while IFS= read -r file; do
              case "$file" in Cargo.toml | CHANGELOG.md) ;; *) return 1 ;; esac
            done <<< "$files"
            changed="$(git diff -U0 "$1^" "$1" | grep -E '^[-+]' | grep -vE '^(\+\+\+|---) ' || true)"
            grep -qE '^\+version = "' <<< "$changed" || return 1
            ! grep -qvE '^[-+](version = "[^"]*"|## \[(Unreleased|[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?)\]( - [0-9]{4}-[0-9]{2}-[0-9]{2})?)?$' <<< "$changed"
          }
          base="$(git merge-base "$PR_BASE" "$PR_HEAD")"
          linked="$(git log --format=%B "$(git merge-base origin/beta "$PR_HEAD")..origin/beta")"
          missing=()
          while read -r mark sha _; do
            [ "$mark" = "+" ] || continue                       # "-": a patch-equivalent commit is on beta
            src="$(git log -1 --format=%B "$sha" | sed -n 's/.*(cherry picked from commit \([0-9a-f]\{40\}\)).*/\1/p')"
            src="${src%%$'\n'*}"
            if [ -n "$src" ] && git merge-base --is-ancestor "$src" origin/beta; then continue; fi   # the PR's commit names its beta source
            if grep -qF "(cherry picked from commit ${sha})" <<< "$linked"; then continue; fi   # a beta commit names it
            if release_commit "$sha"; then
              echo "a release commit, main-born by nature (Cargo.toml's version and CHANGELOG.md's headings alone): $(git log -1 --oneline "$sha")"
              continue
            fi
            missing+=("$sha")
          done < <(git cherry origin/beta "$PR_HEAD" "$base")
          if [ "${#missing[@]}" -eq 0 ]; then
            echo "every commit of the PR ($(git rev-parse --short "$base")..$(git rev-parse --short "$PR_HEAD")) is on origin/beta $(git rev-parse --short origin/beta) by sha, patch or cherry-pick link, or a release commit"
            exit 0
          fi
          echo "The commits of this PR beta lacks (no patch-equivalent, no cherry-pick link, not a release commit):"
          for sha in "${missing[@]}"; do git log -1 --oneline "$sha"; done
          echo "::error::${#missing[@]} commit(s) of this PR were not born on beta; land each on beta through a PR, then cherry-pick it here with -x"
          exit 1
