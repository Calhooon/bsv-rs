name: CI

on:
  push:
    branches: [main, beta]
  pull_request:
    branches: [main, beta]
  # release.yml runs these same jobs on a version tag before it publishes
  workflow_call:

permissions:
  contents: read

# a newer push to the same branch or PR cancels the run it supersedes; a tag's run is never cancelled
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, beta]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: ${{ matrix.rust }}

      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.rust }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.rust }}-

      - name: Run unit tests
        run: cargo test --lib --all-features --verbose

      - name: Run integration tests
        run: cargo test --test integration_tests --all-features --verbose

      - name: Run cross-SDK tests
        run: cargo test --test cross_sdk_tests --all-features --verbose

      - name: Run sighash tests
        run: cargo test --test sighash_tests --all-features --verbose

      - name: Run EC tests
        run: cargo test --test ec_tests --all-features --verbose

      # the consensus witness files: every rule the differential against bitcoin-sv found, pinned on its
      # witness transaction; never run in CI before this step (0.3.25 to 0.3.28 relied on local runs).
      # script_stack_memory_witness holds about 100 MB at its peak (its large rows run one at a time);
      # resource_limits pins the default mode's local budget, unchanged since 0.3.23
      - name: Run the consensus witness tests
        run: cargo test --test script_flags_witnesses --test script_residual_witnesses --test script_low_s_order_witness --test script_num_length_witness --test script_int64_operand_witness --test script_int64_fold_witness --test script_shift_count_witness --test script_sighash_dispatch_witness --test script_undefined_hashtype_witness --test script_stack_memory_witness --test resource_limits --all-features --verbose

      # R404-H1: a LOCAL work bound within one input, never a script verdict.
      - name: Run the local work budget witness
        run: cargo test --test script_work_budget --all-features --verbose

      # the streaming BEEF reader: the rows of the Lean definition with their offsets and kinds, the
      # deep chain at 100,000 links on a 1 MiB stack, the wide BUMP at 16,384 leaves, the limits
      # without a verdict
      - name: Run the streaming BEEF witnesses
        run: cargo test --test beef_stream --test beef_stream_deep --test beef_stream_linear_spend --test beef_stream_pause --test beef_limits --all-features --verbose

      # the dhat heap measurements: one profiler per process, so each test holds the file's lock and
      # one harness thread also keeps slow-test diagnostics out of the active global profile
      - name: Run the memory profiling tests
        run: cargo test --test memory_profiling --all-features --verbose -- --test-threads=1

      - name: Run doc tests
        run: cargo test --doc --all-features

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
          components: clippy

      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ubuntu-clippy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ubuntu-clippy-

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  # the conformance vectors as one named check (a required status on main): the shared JSON under
  # tests/vectors/ and the ts-stack corpus. The conformance files skip when the corpus is absent
  # (Calhooon/bsv-rs#31), so the corpus is checked out at the commit the pinned totals were audited
  # against (5,116 evaluation vectors) and its presence is asserted before the tests run
  vectors:
    name: vectors
    runs-on: ubuntu-latest
    env:
      BSV_CONFORMANCE_DIR: ${{ github.workspace }}/ts-stack/conformance
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check out the ts-stack conformance corpus
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: bsv-blockchain/ts-stack
          ref: edf6e03dad39bd7bc4fc6e73e64de3a2b6f805c9
          path: ts-stack
          sparse-checkout: conformance
          persist-credentials: false

      - name: Assert the corpus is present
        run: test -f "$BSV_CONFORMANCE_DIR/META.json"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable

      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ubuntu-vectors-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ubuntu-vectors-

      - name: Run the chain primitive vectors
        run: cargo test --all-features --test chain_primitives --test chain_difficulty --test chain_encoding --test canonical_varint --test hash_stream --test hkdf_wycheproof --verbose

      - name: Run the vector-backed tests
        run: cargo test --all-features --test conformance_beef --test conformance_scripts --test script_vectors_tests --test broadcaster_http_tests --test wallet_http_json_busy_tests --verbose -- --nocapture

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable

      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ubuntu-docs-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ubuntu-docs-

      - name: Build docs
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -Dwarnings

  # the workflows linted (bsv-stack-lean #145), shellcheck on every run script: actionlint is built
  # from its release source, the tarball pinned by sha256. Every `uses:` in ci.yml and release.yml
  # is pinned by a commit sha with its version beside it (#144)
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 454800bd4f854592bcfe79b161f71d56e35940eb7016e48a26dd356adc9d400a
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Build actionlint from its pinned source
        run: |
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tar.gz" "https://github.com/rhysd/actionlint/archive/refs/tags/v${ACTIONLINT_VERSION}.tar.gz"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/actionlint-${ACTIONLINT_VERSION}"
          go build -o "$RUNNER_TEMP/bin/actionlint" ./cmd/actionlint

      - name: Every action pinned by a commit sha
        run: |
          if grep -nE '^\s*-?\s*uses:' .github/workflows/*.yml | grep -vE 'uses: (\./|[^@ ]+@[0-9a-f]{40} # v)'; then
            echo "::error::a uses: line above is not pinned by a 40-hex commit sha with its version"
            exit 1
          fi

      - name: Lint the workflows
        run: '"$RUNNER_TEMP/bin/actionlint" -no-color'

  # the secrets scan (bsv-stack-lean #140): gitleaks over every commit of the checkout, the
  # values redacted; the findings judged not secrets are named by fingerprint in .gitleaksignore.
  # gitleaks is built from its release source, the tarball pinned by sha256 (no third-party action)
  secrets:
    name: secrets
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: e90fb266d75837e75894c778bf594ab8e2787f12dce5a62651f21b893eaf9abb
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build gitleaks from its pinned source
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" "https://github.com/gitleaks/gitleaks/archive/refs/tags/v${GITLEAKS_VERSION}.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/gitleaks-${GITLEAKS_VERSION}"
          go build -o "$RUNNER_TEMP/bin/gitleaks" .

      - name: Scan the history
        run: '"$RUNNER_TEMP/bin/gitleaks" git --redact --no-banner --exit-code 1 .'

  # the declared rust-version (bsv-stack-lean #139): the library with every feature, native and
  # wasm32, on that toolchain, the dependencies resolved to versions it supports
  msrv:
    name: msrv
    runs-on: ubuntu-latest
    env:
      CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: "1.88.0"
          targets: wasm32-unknown-unknown

      - name: The manifest declares this toolchain
        run: grep -qx 'rust-version = "1.88"' Cargo.toml

      - name: Check the library
        run: cargo check --lib --all-features

      - name: Check the library on wasm32
        run: cargo check --lib --target wasm32-unknown-unknown --no-default-features --features "full,wasm"

  # the unused dependencies (bsv-stack-lean #137): cargo-machete reads the manifests and the
  # sources of the crate and fuzz/, no build; non-blocking until a captain asks. The tool is
  # installed by version from crates.io with its own lock, without the workflow's -Dwarnings
  machete:
    name: unused dependencies
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable

      - name: Install cargo-machete 0.9.2
        env:
          RUSTFLAGS: ""
        run: cargo install cargo-machete --version 0.9.2 --locked --root "$RUNNER_TEMP/tools"

      - name: Run cargo-machete
        run: '"$RUNNER_TEMP/tools/bin/cargo-machete" --with-metadata'

  deny:
    name: deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Install cargo-deny 0.20.2
        env:
          RUSTFLAGS: ""
          CARGO_TARGET_DIR: ${{ runner.temp }}/cargo-deny-target
        run: cargo install cargo-deny --version 0.20.2 --locked --root "$RUNNER_TEMP/tools"

      # This library does not commit Cargo.lock. Resolve once, then keep that
      # same lockfile for all three graphs; every check must succeed.
      - name: Resolve the audit lockfile
        run: cargo generate-lockfile

      - name: Check all features, the Cloudflare slice and default features
        run: |
          result=0
          "$RUNNER_TEMP/tools/bin/cargo-deny" --locked --all-features check || result=1
          "$RUNNER_TEMP/tools/bin/cargo-deny" --locked --no-default-features --features "auth,wallet,transaction,overlay,socketio,wasm" --target wasm32-unknown-unknown check || result=1
          "$RUNNER_TEMP/tools/bin/cargo-deny" --locked check || result=1
          exit "$result"

  benchmarks:
    name: Benchmark Regression Check
    runs-on: ubuntu-latest
    # Only run on PRs to avoid redundant runs on main
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0  # Need full history for branch checkout

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable

      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-bench-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-bench-

      - name: Install critcmp
        run: cargo install critcmp

      # the two ref names reach the shell through the environment, never by expansion into the script
      - name: Benchmark main branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git checkout "$BASE_REF"
          cargo bench --bench primitives_bench --bench hash_bench -- --save-baseline main

      - name: Benchmark PR branch
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git checkout "$HEAD_REF"
          cargo bench --bench primitives_bench --bench hash_bench -- --save-baseline pr

      - name: Compare benchmarks
        run: |
          critcmp main pr

  benchmarks-build:
    name: Benchmarks Build
    runs-on: ubuntu-latest
    # Run on push to main to ensure benchmarks compile
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable

      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-bench-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-bench-

      - name: Build benchmarks
        run: cargo bench --no-run

  # Add each new producer job to needs when it lands (#77, #78, #80).
  # Missing producers are reported by name; this job never invents measurements.
  scoreboard:
    name: scoreboard
    if: ${{ always() }}
    needs: [test, clippy, fmt, vectors, docs, actionlint, secrets, msrv, machete, benchmarks, benchmarks-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Download available scoreboard inputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: ${{ runner.temp }}/scoreboard-inputs
          pattern: '{*bench*,*ratchet*,*wasm*,*mutant*,*mutation*}'

      - name: scoreboard
        env:
          SCOREBOARD_REPOSITORY: ${{ github.repository }}
          SCOREBOARD_COMMIT: ${{ github.sha }}
          SCOREBOARD_RUN: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          repository = os.environ["SCOREBOARD_REPOSITORY"]
          commit = os.environ["SCOREBOARD_COMMIT"]
          run_id = os.environ["SCOREBOARD_RUN"]
          definitions = {
              "benchmarks": ("benchmarks (#77)", ("bench",), ("benches/baseline.json", "baseline.json")),
              "ratchets": ("ratchet (#78)", ("ratchet",), ("docs/ratchets.json", "ratchets.json")),
              "wasm_sizes": ("wasm32 (#80/#96)", ("wasm",), ("wasm-sizes.json",)),
              "mutation": ("mutants (#81; the nightly workflow, not yet in the tree)", ("mutant", "mutation"), ("mutation-summary.json",)),
          }
          report = {
              "repository": repository,
              "commit": commit,
              "run_id": run_id,
              "inputs": {
                  key: {"producer": spec[0], "status": "not yet measured", "records": []}
                  for key, spec in definitions.items()
              },
              "errors": [],
          }

          def reject_constant(value):
              raise ValueError("Non-finite JSON constant: " + value)

          def record(key, raw, source):
              try:
                  data = json.loads(raw, parse_constant=reject_constant)
                  json.dumps(data, allow_nan=False)
              except (ValueError, UnicodeDecodeError):
                  report["errors"].append("Invalid JSON from " + source["file"])
                  return
              report["inputs"][key]["records"].append({
                  "source": source,
                  "sha256": hashlib.sha256(raw).hexdigest(),
                  "data": data,
              })
              report["inputs"][key]["status"] = "available"

          try:
              downloads = Path(os.environ["RUNNER_TEMP"], "scoreboard-inputs")
              for path in sorted(downloads.rglob("*.json")):
                  relative = path.relative_to(downloads)
                  artifact = relative.parts[0]
                  for key, (_, stems, filenames) in definitions.items():
                      if any(stem in artifact.lower() for stem in stems) and any(
                          relative.as_posix().endswith("/" + name) for name in filenames
                      ):
                          record(key, path.read_bytes(), {
                              "kind": "current_run",
                              "commit": commit,
                              "run_id": run_id,
                              "artifact": artifact,
                              "file": relative.as_posix(),
                          })
              for key, filename in (("benchmarks", "benches/baseline.json"), ("ratchets", "docs/ratchets.json")):
                  baseline = Path(filename)
                  if baseline.is_file():
                      record(key, baseline.read_bytes(), {
                          "kind": "repository_baseline",
                          "commit": commit,
                          "file": filename,
                      })
          except OSError as error:
              report["errors"].append(str(error))

          encoded = json.dumps(report, indent=2, sort_keys=True, allow_nan=False) + "\n"
          Path(os.environ["RUNNER_TEMP"], "scoreboard.json").write_text(encoded)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## bsv-rs scoreboard\n\n```json\n" + encoded + "```\n")
          for entry in report["inputs"].values():
              print(f"{entry['producer']}: {entry['status']}")
          if report["errors"]:
              raise SystemExit("scoreboard: collection failed; see the JSON errors")
          PY
