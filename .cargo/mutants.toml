  '''^src/transaction/merkle_path\.rs:660:27: replace match guard \*root != working_hash with true in RootWalker<'a>::root_from$''',
  '''^src/transaction/merkle_path\.rs:660:27: replace match guard \*root != working_hash with false in RootWalker<'a>::root_from$''',
  '''^src/transaction/merkle_path\.rs:660:33: replace != with == in RootWalker<'a>::root_from$''',
