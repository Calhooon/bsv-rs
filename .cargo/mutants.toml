# Equivalent mutants, declared under the owner's rule of 2026-11-01 ("each a test or a stated
# equivalent mutant"): a mutant enters this list only with the rule that makes it unobservable
# (the node's source at the pin, the sibling bsv-script-lean's definition, the reference's
# operation) and after three independent reads accept it (the ensemble rule). A line shift makes
# the entry stop matching and the mutant reappear as a survivor, which is the safe failure.
exclude_re = [
  # src/script/templates/rpuzzle.rs:350:34, `<` to `<=` (#603, PR #615). The comparison bounds a
  # direct push against OP_PUSHDATA1 (76 bytes): at the one length where the two branches differ,
  # 76, both write the opcode byte 0x4c (bitcoin-sv v1.2.3 script.h:106-113 and
  # interpreter.cpp:344-351; bsv-script-lean lean/BsvScript/Sighash.lean:277-281 and
  # Machine.lean:78; RPuzzle.ts:65 at ts-stack@edf6e03 and its recording at 76 in
  # tests/vectors/rpuzzle_lock_and_spend_603.json). Three reads: the cold read (0.86), the
  # adversarial read with every length 0 to 80 and the PUSHDATA edges probed (0.98), the rule
  # read (0.97).
  '^src/script/templates/rpuzzle\.rs:350:34: replace < with <= in <impl ScriptTemplate for RPuzzle>::lock$',
  # src/script/template.rs:210:36, `|` to `^` in compute_sighash_scope (#603, PR #624). The
  # operands' bits are disjoint under the sighash rule (a base type 1 to 3 against FORKID 0x40), so
  # `^` and `|` give the same word for every SignOutputs (bitcoin-sv v1.2.3 sighashtype.h:16-21,43,
  # 73-74,87; TransactionSignature.ts:240-245 and SignatureUtils.ts:44-62 at ts-stack@edf6e03;
  # bsv-script-lean lean/BsvScript/Sighash.lean:52-58,73,79,478). Three reads: the cold read
  # (accepts), the adversarial read with every SignOutputs value under both anyone_can_pay values
  # and twelve signed and verified transactions byte-identical (EQUIVALENT, 0.97), the rule read
  # with the six scopes 0x41, 0xc1, 0x42, 0xc2, 0x43, 0xc3 equal on the tree and the mutant
  # (EQUIVALENT, 0.97).
  '^src/script/template\.rs:210:36: replace \| with \^ in compute_sighash_scope$',
  # src/transaction/beef.rs:912:33, `<` to `<=` in `Beef::sort_txs` (#603, PR #632). The indices
  # never equal at that comparison by the sort's invariant: a transaction never waits on its own
  # txid once accepted (the repeat-txid skip precedes the waking of waiters), so `<` and `<=`
  # choose the same branch (bsv-script-lean lean/BsvChain/Views/Wire/BEEF.lean:338-342,370-373,
  # no txid among its own parents; the reference's sortTxs in Beef.ts at ts-stack@edf6e03). Three
  # reads: the cold read (MERGE, 0.9), the adversarial read with self-referencing, merged
  # raw/txid-only, self-caching and ring shapes probed byte-identical (EQUIVALENT, 0.95), the
  # rule read (EQUIVALENT, 0.96).
  '^src/transaction/beef\.rs:912:33: replace < with <= in Beef::sort_txs$',
  # src/script/script.rs:257:30, 280:31, 280:43, 280:56, `|` to `^` in Script::parse_chunks (#603,
  # shard B). The size of OP_PUSHDATA2 and OP_PUSHDATA4 is the little-endian sum of its size
  # bytes, `a + 256 * b` and `a + 256 * (b + 256 * (c + 256 * d))` (bsv-script-lean@5dc337e1
  # lean/BsvScript/Machine.lean:39,43; bitcoin-sv v1.2.3 script.h:180-191): each operand is one
  # byte shifted into its own 8-bit lane, so every `|` joins operands with no bit in common, where
  # `|`, `^` and `+` agree under any grouping (`^` binds before `|`). No entry of the sibling's
  # corpora (all nine, road, million, xsig-144) moved under any of the four; every pair of size
  # bytes checked exhaustively, 0 differences; tests/script_script_603_b.rs green under each.
  # The lane's own reads; the ensemble's three independent reads are pending.
  '^src/script/script\.rs:257:30: replace \| with \^ in Script::parse_chunks$',
  '^src/script/script\.rs:280:31: replace \| with \^ in Script::parse_chunks$',
  '^src/script/script\.rs:280:43: replace \| with \^ in Script::parse_chunks$',
  '^src/script/script\.rs:280:56: replace \| with \^ in Script::parse_chunks$',
  # src/transaction/merkle_path.rs:660:27 replaced by true, 660:27 replaced by false and 660:33
  # `!=` to `==`, with 592:13 (the `shared` field deleted from `RootWalker::shared`) (#603, PR #628).
  # A node's hash at a level and offset is a function of its inputs, not of the walk that reaches
