[package]
name = "bsv-rs-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
async-trait = "0.1"
futures = "0.3"
reqwest = { version = "0.12", default-features = false }
serde = "1"
serde_json = "1.0"
tokio = { version = "1", features = ["rt", "net", "time"] }

[dependencies.bsv-rs]
path = ".."
features = ["full", "http"]

[[bin]]
name = "fuzz_script_parser"
path = "fuzz_targets/fuzz_script_parser.rs"
test = false
doc = false

