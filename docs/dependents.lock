targets = ["native"]
features = []  # "axum" is named in the two argument lists below, so that nothing follows the test names after `--`
check_args = ["--workspace", "--all-targets", "--features", "axum"]
# One test is not run until this row re-pins: `the_door_verifies_against_the_sdks_dispatched_signing_digest` spends at
# transaction version 1 with a SIGHASH_CHRONICLE signature and expects it verified; the stable line's next security
# patch refuses that signature at version 1 in the default mode, as the 0.9 line already does.
test_args = ["--workspace", "--lib", "--tests", "--features", "axum", "--", "--skip", "payment_core::tests::the_door_verifies_against_the_sdks_dispatched_signing_digest"]

