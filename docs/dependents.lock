# The private app trees (the agents, Zanaadu, Teragun, the-composer) are not rows here: their
# repository paths and commits stay out of this public file until the owner says otherwise;
# docs/DEPENDENTS.md names them as the epic does. A private row, when admitted, is skipped
# with a warning unless DEPENDENTS_READ_TOKEN is present.


