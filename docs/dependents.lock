[[consumer]]
id = "bsv-wallet-infra-cloudflare"
repository = "Calhooon/bsv-wallet-infra-cloudflare"
branch = "main"
rev = "7f430ccd3e1a7cb861ac4b5ced7987c91578a64c"
private = false
requirement = "0.8.11"
sdk_features = ["auth", "wallet", "transaction", "wasm"]
sdk_default_features = true
manifests = ["Cargo.toml"]
targets = ["wasm32-unknown-unknown"]
features = []
check_args = ["--workspace", "--lib"]
# Three tests are not run until this row re-pins: each builds a BEEF whose BUMP places leaves outside its one-level tree
# (the unit test `door::beef_measure::tests::the_counts_are_the_parses`, and the "one BUMP of many leaves" case of
# `the_estimate_bounds_the_parse` and `the_inline_door_holds_its_request_under_the_ceiling` in `tests/beef_measure.rs`)
# and expects it to parse; 0.8.14's reader refuses such a BUMP.
test_args = ["--workspace", "--lib", "--tests", "--", "--skip", "door::beef_measure::tests::the_counts_are_the_parses", "--skip", "the_estimate_bounds_the_parse", "--skip", "the_inline_door_holds_its_request_under_the_ceiling"]

