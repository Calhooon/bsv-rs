[[consumer]]
id = "bsv-middleware-rs"
repository = "Calhooon/bsv-middleware-rs"
branch = "main"
rev = "97d003bbfd327838ff7ef06ddee567d2b8f831eb"
private = false
requirement = "0.8.12"
sdk_features = ["auth", "wallet", "transaction"]
sdk_default_features = true
manifests = ["Cargo.toml"]
targets = ["native"]
features = []  # "axum" is named in the two argument lists below, so that nothing follows the test names after `--`
check_args = ["--workspace", "--all-targets", "--features", "axum"]
# One test is not run until the consumer's main mends it (its pull request #36, open on 2026-11-28, builds the spend at
# version 2): `the_door_verifies_against_the_sdks_dispatched_signing_digest` spends at transaction version 1 with a
# SIGHASH_CHRONICLE signature and expects it verified; 0.8.14 refuses that signature at version 1 in the default mode,
# as the 0.9 line already does.
test_args = ["--workspace", "--lib", "--tests", "--features", "axum", "--", "--skip", "payment_core::tests::the_door_verifies_against_the_sdks_dispatched_signing_digest"]

