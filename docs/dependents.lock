# Remote default-branch snapshots: every row read at its branch tip on 2026-11-14 (the nine rows of
# seven repositories that had moved since the 2026-10-23 snapshot re-pinned that day, five rows
# still at their tips). Pin-move PRs refresh these records.
# The chaintracks-cloudflare row moved again on 2026-11-27, to the tip of its main, which commits
# its Cargo.lock (docs/DEPENDENTS.md, "The chaintracks row's move of 2026-11-27").
# Version requirements belong to the consumers; this lock never widens one.
schema = 1
# The private app trees (the agents, Zanaadu, Teragun, the-composer) are not rows here: their
# repository paths and commits stay out of this public file until the owner says otherwise;
# docs/DEPENDENTS.md names them as the epic does. A private row, when admitted, is skipped
# with a warning unless DEPENDENTS_READ_TOKEN is present.


[[consumer]]
id = "bsv-wallet-cli"
repository = "Calhooon/bsv-wallet-cli"
branch = "main"
rev = "2cc76c9d50bac627f7eb8a44cb60adedbec5f82e"
private = false
requirement = "=0.8.3"
sdk_features = ["full"]
sdk_default_features = true
manifests = ["Cargo.toml"]
targets = ["native"]
features = []
check_args = ["--workspace", "--all-targets"]
test_args = ["--workspace", "--tests"]

[[consumer]]
id = "bsv-wallet-toolbox-rs"
repository = "Calhooon/bsv-wallet-toolbox-rs"
branch = "main"
rev = "3ddf48dbba0437c8429ff5c4c880e3b03105aaae"
private = false
requirement = "0.8.0"
sdk_features = ["full", "http"]
sdk_default_features = true
manifests = ["Cargo.toml"]
targets = ["native"]
features = []  # "sqlite" is named in the two argument lists below, so that nothing follows the test names after `--`
check_args = ["--workspace", "--all-targets", "--features", "sqlite"]
# One test is not run until this row re-pins: `tsc_proof::tests::test_hex_roundtrip` builds a BUMP whose offset lies
# outside its tree and expects it to parse; the stable line's next security patch refuses such a BUMP at the reader.
test_args = ["--workspace", "--lib", "--tests", "--features", "sqlite", "--", "--skip", "tsc_proof::tests::test_hex_roundtrip"]

