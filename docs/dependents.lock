# Remote default-branch snapshots: every row read at its branch tip on 2026-11-28 (twelve rows of
# nine repositories moved that day; the chaintracks and template rows were already at their tips),
# docs/DEPENDENTS.md, "The lock at the dependents' lines of 2026-11-28". Pin-move PRs refresh these records.
# Three rows' revisions commit no Cargo.lock (the toolbox, bsv-middleware-rs, bsv-middleware-cloudflare):
# the job resolves their graphs afresh on every run.
# Version requirements belong to the consumers; this lock never widens one.
schema = 1
# The private app trees (the agents, Zanaadu, Teragun, the-composer) are not rows here: their
# repository paths and commits stay out of this public file until the owner says otherwise;
# docs/DEPENDENTS.md names them as the epic does. A private row, when admitted, is skipped
# with a warning unless DEPENDENTS_READ_TOKEN is present.


