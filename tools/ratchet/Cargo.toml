[package]
name = "bsv-rs-ratchet"
version = "0.1.0"
edition = "2021"
publish = false
rust-version = "1.95"

# The measurement tool is deliberately independent of the library manifest.
[workspace]

# The census hashes every 40-token window. Optimize the tool even for `run`.
[profile.dev.package.bsv-rs-ratchet]
opt-level = 2

[dependencies]
proc-macro2 = { version = "=1.0.106", features = ["span-locations"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
syn = { version = "=2.0.118", features = ["full", "visit"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
