[package]
name = "bench-compare"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false

# Deliberately independent of the SDK's package and feature graph.
[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
