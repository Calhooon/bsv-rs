# gitleaks policy for the `secrets` CI job (gitleaks 8.30.1, `gitleaks git --redact -v --exit-code 1
# --log-opts=<range> .`: on a pull request the PR's own commits, on a push and a dispatch the line's
# full history; bsv-rs#272). The default rules apply everywhere; each allowlist below names
# the recorded test material it lets through, which looks like a key and is not one. A real secret
# never belongs in any of them; a reviewer reads a new file under these paths as a vector, and the
# `secrets` job keeps scanning everything else.
title = "bsv-rs"

[extend]
useDefault = true

# tests/fixtures/: the golden fixtures of #76, bodies and frames recorded from this crate's own
# writers with FIXED test keys (the README seed, fixed public points) and the identity keys those
# produce; gitleaks' generic-api-key rule fires on the hex.
[[allowlists]]
description = "golden fixtures recorded with fixed test keys (#76)"
paths = ['''^tests/fixtures/''']

# tests/vectors/auth_fetch_423.json: the nonces, signatures and request IDs from
# tests/support/auth_fetch_423.mjs, the recorder's fixed test entropy under Node 22.18.0.
# The cold review re-recorded two byte-identical runs; a reviewer reads this file
# as a vector. Only this one file is let through, never tests/vectors/ as a whole.
[[allowlists]]
description = "the AuthFetch vector's nonces, signatures and request IDs from the recorder's fixed test entropy (#423)"
paths = ['''^tests/vectors/auth_fetch_423\.json$''']

# fuzz/corpus/: the fuzz seed corpora of #82, the vectors' bytes, including identity-key hex.
[[allowlists]]
description = "fuzz seed corpora written from the vectors (#82)"
paths = ['''^fuzz/corpus/''']

# fuzz/corpus-gen/src/main.rs: the auth header seed's nonce, the base64 of the bytes
# ab cd ef 12 34 56 78 90 repeated to 32. Only that literal is let through, never the file.
[[allowlists]]
description = "the fixed test nonce of corpus-gen's auth header seed (#82)"
regexes = ['''^q83vEjRWeJCrze8SNFZ4kKvN7xI0VniQq83vEjRWeJA=$''']

# tests/wallet_brc56_hmac_tests.rs: the six HMAC keys (shared-point X coordinates) of BRC-56's
# published test vectors (wallet/0056.md at 5119a9b, "never use it for value"), derived from a root
# key that is the SHA-256 of a public label. Only those six literals are let through, never the file.
[[allowlists]]
description = "the six BRC-56 HMAC key vectors (#148)"
regexes = [
  '''^b1273850ff41cee365a4d590e3c323822129f66c5a9b2eacb8b9e790e000e396$''',
  '''^000c82ac78dc853158f24883ccfda332be6ba34f821765357cc4ef2a190a28fd$''',
  '''^00009dc11102cc72eca3c6e4e232460eac581e9b2cee1bb35c395b635d3f6393$''',
  '''^1896e0210afac8dbb4ca3bd4ea25c8377d0352ab83e62fe6ffabeca78c1a6113$''',
  '''^001829e1dd58fc2c45b6edcbb277eecdecbab1c884b42fd779e131fea5881b45$''',
  '''^0000a52a35523175d6c181e90f463a27cdbf70f4ecf055e912d6fc24ac7d0e3c$''',
]

# tests/vectors/wallet_http_json_shapes_105.json and tests/wallet_http_json_shapes_105.rs: the
# #105 HTTP JSON witnesses' identity key is secp256k1's generator point G in compressed form, the
# public key of the private key 1, a public constant of the curve; the same literal sits in the
# EC, sighash and cross-SDK tests and the auth and overlay vectors. Only that literal is let
# through, never the files.
[[allowlists]]
description = "the generator point as the #105 witnesses' identity key"
regexes = ['''^0279be667ef9dcbbac55a06295ce870b07029bfcdb2dce28d959f2815b16f81798$''']

# tests/wallet_http_json_shapes_105.rs: the public-key-shaped hex the old `{"publicKey": ..}` revealer
# test sends to show the shape is refused (#105, item 9): the Go SDK's test public key, which the
# wallet-wire vectors carry too; a test literal, not a key in use. Only that literal is let
# through, never the files.
[[allowlists]]
description = "the old revealer shape's test key (#105)"
regexes = ['''^025ad43a22ac38d0bc1f8bacaabb323b5d634703b7a774c4268f6a09e4ddf79097$''']

# tests/vectors/transport_unsigned_response_354.json: the #354 transport vector's `x-bsv-auth-identity-key`
# header is the public point of the scalar 42 (`new PrivateKey(42).toPublicKey()` in
# tests/support/transport_unsigned_response_354.mjs, the `server_key()` of #353's tests), recorded from the
# reference's SimplifiedFetchTransport; a public key of a test scalar, not a key in use. The same literal sits
# in #353's test and vector inside the Peer's error strings, where the generic-api-key rule does not reach it;
# as a bare JSON header value it does. Only that literal is let through, never the file.
[[allowlists]]
description = "the scalar-42 public point as the #354 transport vector's identity header"
regexes = ['''^02fe8d1eb1bcb3432b1db5833ff5f2226d9cb5e65cee430558c18ed3a3c86ce1af$''']

# tests/vectors/auth_hmac_issuance_379.json and wallet_hmac_key_379.json: the root key and the six
# derived HMAC keys of ts-stack's ProtoWallet.brc56-hmac-key.test.ts (9a2787b8c), BRC-56's published
# vectors in the amendment's minimal-length form (wallet/0056.md at d4ce8119f, "never use it for
# value"), recorded under Node 22 (#379). The generic-api-key rule reads the rootKey and hmacKey
# fields by entropy (six of the eight sites on 8.30.1). Only these literals are let through, never
# the files.
[[allowlists]]
description = "the #379 HMAC key vectors: the root key and the six derived keys"
regexes = [
  '''^f0efba88c117ca2614554bb676d743f413822a31e3c8d70cfcc5fff119d20a07$''',
  '''^b1273850ff41cee365a4d590e3c323822129f66c5a9b2eacb8b9e790e000e396$''',
  '''^0c82ac78dc853158f24883ccfda332be6ba34f821765357cc4ef2a190a28fd$''',
  '''^9dc11102cc72eca3c6e4e232460eac581e9b2cee1bb35c395b635d3f6393$''',
  '''^1896e0210afac8dbb4ca3bd4ea25c8377d0352ab83e62fe6ffabeca78c1a6113$''',
  '''^1829e1dd58fc2c45b6edcbb277eecdecbab1c884b42fd779e131fea5881b45$''',
  '''^a52a35523175d6c181e90f463a27cdbf70f4ecf055e912d6fc24ac7d0e3c$''',
]

# tests/support/http_json_pending_432.mjs: the recorder's row `variations(76, 'discoverByIdentityKey',
# 'certificates.0.subject', [other])` (#432). The generic-api-key rule reads the method name
# `discoverByIdentityKey` as a key name, the comma as its assignment and the JSON path
# `certificates.0.subject` as its value (entropy 3.54 on 8.30.1): a path into the reference's result
# shape, not a key of any kind. Only that path string is let through, never the file.
[[allowlists]]
description = "the #432 recorder's JSON path read as a key value by the generic-api-key rule"
regexes = ['''^certificates\.0\.subject$''']
